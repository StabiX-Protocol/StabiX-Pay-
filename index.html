<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family: Arial;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:12px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:15px;
    }
    button {
      background:#2563eb;
      color:white;
      font-weight:bold;
    }
    hr {
      border:0;
      border-top:1px solid #1e293b;
      margin:15px 0;
    }
    .small {
      font-size:12px;
      opacity:0.7;
    }
    .tx {
      font-size:13px;
      margin-top:6px;
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
/* ============ TELEGRAM INIT ============ */
const tg = window.Telegram?.WebApp;
tg?.ready();

let tgUser = tg?.initDataUnsafe?.user || {
  id: "browser_user",
  username: "BrowserUser"
};

const WALLET = "TG_" + tgUser.id;

/* ============ STORAGE ============ */
let users = JSON.parse(localStorage.getItem("stabix_users") || "{}");
let txs   = JSON.parse(localStorage.getItem("stabix_txs") || []);

/* ============ INIT USER ============ */
if (!users[WALLET]) {
  users[WALLET] = {
    username: tgUser.username || "User",
    balance: 0
  };
  save();
}

render();

/* ============ UI ============ */
function render() {
  const user = users[WALLET];

  const history = txs
    .filter(t => t.from === WALLET || t.to === WALLET)
    .reverse()
    .map(t => `
      <div class="tx">
        <b>${t.type}</b> ${t.amount} USDC<br>
        <span class="small">${new Date(t.time).toLocaleString()}</span>
      </div>
    `).join("") || `<p class="small">No transactions yet</p>`;

  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>

      <hr>
      <h3>Balance</h3>
      <b>${user.balance.toFixed(2)} USDC</b>

      <hr>
      <h3>Send USDC</h3>
      <input id="to" placeholder="Receiver Wallet (TG_123)" />
      <input id="amt" type="number" placeholder="Amount" />
      <button onclick="send()">Send</button>

      <hr>
      <h3>Transaction History</h3>
      ${history}

      <hr>
      <h3>Change Username</h3>
      <input id="newname" placeholder="New username" />
      <button onclick="changeName()">Update</button>
    </div>
  `;
}

/* ============ ACTIONS ============ */
function send() {
  const to = document.getElementById("to").value.trim();
  const amt = Number(document.getElementById("amt").value);

  if (!users[to]) return alert("User not found");
  if (amt <= 0) return alert("Invalid amount");
  if (users[WALLET].balance < amt) return alert("Insufficient balance");

  users[WALLET].balance -= amt;
  users[to].balance += amt;

  txs.push({
    from: WALLET,
    to,
    amount: amt,
    type: "Sent",
    time: Date.now()
  });

  save();
  render();
}

function changeName() {
  const n = document.getElementById("newname").value.trim();
  if (!n) return;
  users[WALLET].username = n;
  save();
  render();
}

function save() {
  localStorage.setItem("stabix_users", JSON.stringify(users));
  localStorage.setItem("stabix_txs", JSON.stringify(txs));
}
</script>
</body>
</html>
