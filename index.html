<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Firebase COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#2563eb; color:white; font-weight:bold; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
    .warn { color:#facc15; font-size:13px; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script>
(async function () {

  const app = document.getElementById("app");

  /* ===== TELEGRAM SAFE INIT ===== */
  let tgUser = null;
  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    tgUser = Telegram.WebApp.initDataUnsafe?.user;
  }

  if (!tgUser) {
    tgUser = { id: "DEBUG_1001", username: "DebugUser" };
  }

  /* ===== FIREBASE INIT ===== */
  firebase.initializeApp({
    apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
    authDomain: "stabix-backend-v1.firebaseapp.com",
    projectId: "stabix-backend-v1",
    storageBucket: "stabix-backend-v1.appspot.com",
    messagingSenderId: "351361221507",
    appId: "1:351361221507:web:ebaf0d15e86d4b184c6cb6"
  });

  const db = firebase.firestore();

  /* ===== IDENTITY ===== */
  const WALLET = "TG_" + tgUser.id;
  const userRef = db.collection("users").doc(WALLET);
  const validatorRef = db.collection("validators").doc(String(tgUser.id));

  /* ===== UI RENDER ===== */
  function render(html) {
    app.innerHTML = html;
  }

  /* ===== INIT ===== */
  async function init() {
    try {
      const snap = await userRef.get();
      snap.exists ? renderApp() : renderSetup();
    } catch (e) {
      render("<div class='box'>Error loading app</div>");
      console.error(e);
    }
  }

  /* ===== SETUP ===== */
  function renderSetup() {
    render(`
      <div class="box">
        <h3>Create Username</h3>
        <input id="uname" placeholder="Username">
        <button id="saveBtn">Save</button>
      </div>
    `);

    document.getElementById("saveBtn").onclick = saveProfile;
  }

  async function saveProfile() {
    const u = document.getElementById("uname").value.trim();
    if (!u) return alert("Enter username");

    await userRef.set({
      username: u,
      walletAddress: WALLET,
      balance: 0,
      pendingRequest: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    renderApp();
  }

  /* ===== MAIN APP ===== */
  async function renderApp() {
    const user = (await userRef.get()).data();
    const isValidator = (await validatorRef.get()).exists;

    render(`
      <div class="box">
        <h2>${user.username}</h2>
        <p class="small">${WALLET}</p>

        <hr><b>Balance:</b> ${user.balance.toFixed(2)} USDC
        ${user.pendingRequest ? `<div class="warn">Pending approval</div>` : ""}

        <hr>
        <h3>Deposit / Withdraw</h3>
        <select id="type">
          <option value="deposit">Deposit</option>
          <option value="withdraw">Withdraw</option>
        </select>
        <input id="amt" type="number" placeholder="Amount">
        <input id="waddr" placeholder="Wallet Address">
        <input id="txh" placeholder="Tx Hash (deposit)">
        <button id="submitBtn">Submit</button>

        <hr>
        <h3>History</h3>
        <div id="historyBox">Loading…</div>

        ${isValidator ? validatorPanel() : ""}
      </div>
    `);

    document.getElementById("submitBtn").onclick = submitReq;
    loadHistory();
  }

  /* ===== REQUEST ===== */
  async function submitReq() {
    await db.collection("requests").add({
      userId: WALLET,
      amount: Number(document.getElementById("amt").value),
      type: document.getElementById("type").value,
      walletAddress: document.getElementById("waddr").value,
      txHash: document.getElementById("txh").value || "",
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await userRef.update({ pendingRequest: true });
    alert("Request submitted");
  }

  /* ===== HISTORY ===== */
  async function loadHistory() {
    const box = document.getElementById("historyBox");
    try {
      const snap = await db.collection("transactions")
        .where("userId", "==", WALLET)
        .get();

      let html = "";
      snap.forEach(d => {
        const t = d.data();
        html += `
          <div class="tx">
            <b>${t.type}</b> ${t.amount} USDC<br>
            <span class="small">${t.createdAt?.toDate().toLocaleString() || ""}</span>
          </div>`;
      });

      box.innerHTML = html || "No history";
    } catch (e) {
      box.innerHTML = "Failed to load history";
    }
  }

  /* ===== VALIDATOR ===== */
  function validatorPanel() {
    return `
      <hr>
      <h3>Validator Panel</h3>
      <input id="vu" placeholder="User Wallet TG_xxx">
      <button onclick="viewUser()">View User</button>
      <div id="vout"></div>
    `;
  }

  window.viewUser = async () => {
    const u = document.getElementById("vu").value.trim();
    const snap = await db.collection("users").doc(u).get();
    if (!snap.exists) return alert("User not found");
    document.getElementById("vout").innerHTML =
      `<hr>Balance: ${snap.data().balance} USDC`;
  };

  /* ===== START ===== */
  init();

})();
</script>
</body>
</html>
