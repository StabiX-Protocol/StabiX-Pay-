<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
    .warn { color:#facc15; font-size:13px; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp,
  query, where, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ========== FIREBASE ========== */
const appFB = initializeApp({
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1"
});
const db = getFirestore(appFB);

/* ========== TELEGRAM ========== */
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const tgUser = tg.initDataUnsafe?.user;
if(!tgUser?.id){
  document.getElementById("app").innerText = "Telegram only";
  throw "";
}

/* ========== IDENTITY ========== */
const WALLET = "TG_" + tgUser.id;
const userRef = doc(db,"users",WALLET);
const validatorRef = doc(db,"validators",String(tgUser.id));

/* ========== INIT ========== */
async function init(){
  const snap = await getDoc(userRef);
  if(!snap.exists()) return renderSetup();
  renderLogin();
}

/* ========== SETUP / LOGIN ========== */
function renderSetup(){
  app(`<div class="box">
    <h3>Create</h3>
    <input id="uname"><input id="pwd" type="password">
    <button onclick="save()">Create</button>
  </div>`);
}
window.save = async ()=>{
  await setDoc(userRef,{
    username: uname.value,
    password: pwd.value,
    balance:0,
    pendingRequest:false,
    isFrozen:false,
    createdAt:serverTimestamp()
  });
  renderApp();
};

function renderLogin(){
  app(`<div class="box">
    <h3>Login</h3>
    <input id="pwd" type="password">
    <button onclick="login()">Login</button>
  </div>`);
}
window.login = async ()=>{
  const s = await getDoc(userRef);
  if(s.data().password !== pwd.value) return alert("Wrong");
  renderApp();
};

/* ========== MAIN APP ========== */
async function renderApp(){
  const u = (await getDoc(userRef)).data();
  const isValidator = (await getDoc(validatorRef)).exists();

  app(`<div class="box">
    <h2>${u.username}</h2>
    <b>Balance:</b> ${u.balance} USDC
    ${u.isFrozen ? `<div class="warn">Account frozen</div>`:""}

    <hr>
    <h3>Send</h3>
    <input id="sendTo"><input id="sendAmt" type="number">
    <button onclick="send()">Send</button>

    <hr>
    <h3>Deposit / Withdraw</h3>
    <select id="dwType">
      <option value="deposit">Deposit</option>
      <option value="withdraw">Withdraw</option>
    </select>
    <input id="dwAmount" type="number">
    <input id="dwWallet">
    <input id="dwTxHash">
    <button onclick="submitDW()">Submit</button>

    ${isValidator ? validatorPanel() : ""}
  </div>`);

  if(isValidator) setTimeout(loadRequests,300);
}

/* ========== SEND (FREEZE HARD BLOCK) ========== */
window.send = async ()=>{
  try{
    await runTransaction(db, async(tx)=>{
      const s = await tx.get(userRef);
      if(s.data().isFrozen === true) throw "Frozen";
      const amt = Number(sendAmt.value);
      if(amt<=0 || s.data().balance < amt) throw "Invalid";
      tx.update(userRef,{ balance:s.data().balance-amt });
      tx.update(doc(db,"users",sendTo.value),{
        balance:(await tx.get(doc(db,"users",sendTo.value))).data().balance + amt
      });
    });
    renderApp();
  }catch(e){ alert(e); }
};

/* ========== SUBMIT DW (HARD CHECK) ========== */
window.submitDW = async ()=>{
  const snap = await getDoc(userRef);
  const u = snap.data();

  if(u.pendingRequest === true) return alert("Already pending");

  const type = dwType.value;
  const amt = Number(dwAmount.value);

  if(type==="withdraw" && amt > u.balance)
    return alert("Insufficient balance");

  await addDoc(collection(db,"requests"),{
    userId: WALLET,
    type, amount:amt,
    walletAddress: dwWallet.value,
    txHash: type==="deposit" ? dwTxHash.value : "",
    status:"pending",
    createdAt:serverTimestamp()
  });

  await updateDoc(userRef,{ pendingRequest:true, isFrozen:true });
  renderApp();
};

/* ========== VALIDATOR ========== */
function validatorPanel(){
  return `<hr><h3>Validator</h3><div id="vout"></div>`;
}

window.loadRequests = async ()=>{
  const q = query(collection(db,"requests"), where("status","==","pending"));
  const snap = await getDocs(q);
  let h="";
  snap.forEach(d=>{
    const r=d.data();
    h+=`<div class="tx">
      ${r.userId} | ${r.type} | ${r.amount}
      <button onclick="approve('${d.id}')">✔</button>
      <button onclick="reject('${d.id}')">✖</button>
    </div>`;
  });
  vout.innerHTML = h || "No pending";
};

window.approve = async(id)=>{
  await runTransaction(db, async(tx)=>{
    const r = (await tx.get(doc(db,"requests",id))).data();
    const uRef = doc(db,"users",r.userId);
    const u = (await tx.get(uRef)).data();
    const nb = r.type==="deposit" ? u.balance+r.amount : u.balance-r.amount;
    if(nb<0) throw "Invalid";
    tx.update(uRef,{ balance:nb, pendingRequest:false, isFrozen:false });
    tx.update(doc(db,"requests",id),{ status:"approved" });
  });
  loadRequests();
};

window.reject = async(id)=>{
  const r=(await getDoc(doc(db,"requests",id))).data();
  await updateDoc(doc(db,"users",r.userId),{
    pendingRequest:false, isFrozen:false
  });
  await updateDoc(doc(db,"requests",id),{ status:"rejected" });
  loadRequests();
};

function app(h){ document.getElementById("app").innerHTML=h; }
init();
</script>
</body>
</html>
