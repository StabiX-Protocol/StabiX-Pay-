<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; font-size:15px; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    button:disabled { background:#334155; cursor:not-allowed; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; margin-top:8px; padding-bottom:8px; border-bottom:1px dashed #1e293b; }
    .warn { color:#facc15; font-size:13px; margin-top:10px; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
/* ===== NEW FIREBASE SDK (MODULAR) ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
import { getAuth, signInAnonymously, onAuthStateChanged } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ===== FIREBASE CONFIG (YOURS) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1",
  storageBucket: "stabix-backend-v1.firebasestorage.app",
  messagingSenderId: "351361221507",
  appId: "1:351361221507:web:ebaf0d15e86d4b184c6cb6",
  measurementId: "G-SPGZN8ZQMS"
};

/* ===== INIT ===== */
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const db   = getFirestore(app);

const ADMIN_UID = "V2pWpWhfymg1rDQfnyneQdCLU7q1";

let uid = null;
let userRef = null;

/* ===== AUTH ===== */
signInAnonymously(auth).catch(e=>{
  document.getElementById("app").innerText = e.message;
});

onAuthStateChanged(auth, async user=>{
  if(!user) return;
  uid = user.uid;
  userRef = doc(db,"users",uid);

  const snap = await getDoc(userRef);
  if(!snap.exists()){
    renderSetup();
  } else {
    renderDashboard();
  }
});

/* ===== UI ===== */
function appDiv(h){ document.getElementById("app").innerHTML = h; }

/* ===== SETUP ===== */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Username</h3>
      <input id="uname" placeholder="Username" />
      <button onclick="saveUsername()">Save</button>
    </div>
  `);
}

window.saveUsername = async ()=>{
  if(!uname.value.trim()) return alert("Enter username");
  await setDoc(userRef,{
    username: uname.value.trim(),
    balance: 0,
    history: [],
    pendingRequest: false,
    createdAt: serverTimestamp()
  });
  renderDashboard();
};

/* ===== DASHBOARD ===== */
async function renderDashboard(){
  const snap = await getDoc(userRef);
  const user = snap.data();
  const locked = user.pendingRequest === true;
  const isAdmin = uid === ADMIN_UID;

  let historyHtml = "";
  (user.history || []).slice().reverse().forEach(tx=>{
    const red = ["Sent","Withdraw"].includes(tx.type);
    historyHtml += `
      <div class="tx" style="color:${red?"#ef4444":"#22c55e"}">
        <b>${tx.type}</b>: ${tx.amount} USDC<br>
        <span class="small">${new Date(tx.time).toLocaleString()}</span>
      </div>
    `;
  });

  if(!historyHtml) historyHtml="<p class='small'>No transactions</p>";

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${uid}</p>

      <hr><h3>Balance</h3>
      <b>${user.balance.toFixed(2)} USDC</b>

      ${locked?`<div class="warn">⏳ Pending admin approval</div>`:""}

      <hr><h3>Send USDC</h3>
      <input id="to" placeholder="Receiver UID" ${locked?"disabled":""}>
      <input id="amt" type="number" placeholder="Amount" ${locked?"disabled":""}>
      <button onclick="send()" ${locked?"disabled":""}>Send</button>

      <hr><h3>Deposit / Withdraw</h3>
      <select id="txType" ${locked?"disabled":""}>
        <option value="Deposit">Deposit</option>
        <option value="Withdraw">Withdraw</option>
      </select>
      <input id="ra" type="number" placeholder="Amount" ${locked?"disabled":""}>
      <button onclick="submitRequest()" ${locked?"disabled":""}>Submit Request</button>

      <hr><h3>Transaction History</h3>
      ${historyHtml}

      ${isAdmin?`<hr><h3>Admin Panel</h3><p class="small">Approve via Firestore</p>`:""}
    </div>
  `);
}

/* ===== SEND ===== */
window.send = async ()=>{
  const to = document.getElementById("to").value.trim();
  const amt = Number(document.getElementById("amt").value);
  if(!to || amt<=0) return alert("Invalid input");

  await addDoc(collection(db,"requests"),{
    type:"send",
    from: uid,
    to,
    amount: amt,
    createdAt: serverTimestamp()
  });

  alert("Send request submitted");
};

/* ===== REQUEST ===== */
window.submitRequest = async ()=>{
  const amt = Number(document.getElementById("ra").value);
  const type = document.getElementById("txType").value;
  if(amt<=0) return alert("Invalid amount");

  await addDoc(collection(db,"requests"),{
    type,
    user: uid,
    amount: amt,
    createdAt: serverTimestamp()
  });

  await updateDoc(userRef,{ pendingRequest:true });
  renderDashboard();
};
</script>

</body>
</html>
