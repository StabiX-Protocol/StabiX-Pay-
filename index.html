<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; font-size:15px; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    button:disabled { background:#334155; cursor:not-allowed; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; margin-top:8px; padding-bottom:8px; border-bottom:1px dashed #1e293b; }
    .warn { color:#facc15; font-size:13px; margin-top:10px; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  arrayUnion, collection, addDoc, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBWWPgitPhLIYbR-ZmezpaP155cpn1_KPY",
  authDomain: "stabix-49cc6.firebaseapp.com",
  projectId: "stabix-49cc6",
  storageBucket: "stabix-49cc6.appspot.com",
  messagingSenderId: "68502925473",
  appId: "1:68502925473:web:86959dae39a377413800e0"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* TELEGRAM */
const tg = window.Telegram?.WebApp;
tg?.ready();

const ADMIN_TG_ID = "1303497305";
let tgUser = tg?.initDataUnsafe?.user || { id:"browser", username:"Browser" };

const wallet = "TG_" + tgUser.id;
const userRef = doc(db,"users",wallet);
const requestsRef = collection(db,"requests");

/* INIT */
async function init(){
  const snap = await getDoc(userRef);
  if(!snap.exists()){
    appDiv(`
      <div class="box">
        <h3>Create Username (one time)</h3>
        <input id="uname" placeholder="Username" />
        <button onclick="saveUsername()">Save</button>
      </div>
    `);
    return;
  }
  render();
}

window.saveUsername = async ()=>{
  const u = uname.value.trim();
  if(!u) return alert("Enter username");
  await setDoc(userRef,{
    username:u,
    balance:0,
    created:Date.now(),
    history:[],
    pendingRequest:false
  });
  render();
};

/* RENDER */
async function render(){
  const snap = await getDoc(userRef);
  const user = snap.data();
  const isAdmin = String(tgUser.id) === ADMIN_TG_ID;
  const locked = user.pendingRequest === true;

  const historyHtml = (user.history||[])
    .slice(-5)
    .reverse()
    .map(tx=>`
      <div class="tx">
        <b>${tx.type}</b>: ${tx.amount} USDC<br>
        <span class="small">${new Date(tx.time).toLocaleDateString()}</span>
      </div>
    `).join("") || `<p class="small">No transactions</p>`;

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${wallet}</p>

      <hr>
      <h3>Balance</h3>
      <b>${user.balance.toFixed(2)} USDC</b>

      ${locked ? `<div class="warn">⏳ Request pending. All actions locked.</div>` : ``}

      <hr>
      <h3>Send USDC</h3>
      <input id="to" placeholder="Receiver Wallet (TG_xxx)" ${locked?"disabled":""}/>
      <input id="amt" type="number" placeholder="Amount" ${locked?"disabled":""}/>
      <button onclick="send()" ${locked?"disabled":""}>Send</button>

      <hr>
      <h3>Deposit / Withdraw</h3>

      <select id="txType" onchange="toggleTxFields()" ${locked?"disabled":""}>
        <option value="deposit">Deposit</option>
        <option value="withdraw">Withdraw</option>
      </select>

      <input id="rw" placeholder="Your Wallet Address" ${locked?"disabled":""}/>
      <input id="ra" type="number" placeholder="Amount" ${locked?"disabled":""}/>
      <input id="rh" placeholder="Tx Hash (deposit only)" />

      <button onclick="submitRequest()" ${locked?"disabled":""}>Submit Request</button>

      <hr>
      <h3>Recent Transactions</h3>
      ${historyHtml}

      ${isAdmin ? adminPanel() : ""}
    </div>
  `);

  toggleTxFields();
}

/* TOGGLE INPUTS */
window.toggleTxFields = ()=>{
  const type = document.getElementById("txType")?.value;
  const hash = document.getElementById("rh");
  if(!hash) return;
  hash.style.display = type === "deposit" ? "block" : "none";
};

/* SUBMIT REQUEST */
window.submitRequest = async ()=>{
  const type = txType.value;
  const walletAddress = rw.value.trim();
  const amount = Number(ra.value);
  const txHash = rh.value.trim();

  if(!walletAddress || !amount) return alert("Fill all fields");
  if(type==="deposit" && !txHash) return alert("Tx hash required");

  await addDoc(requestsRef,{
    user: wallet,
    type,
    amount,
    walletAddress,
    txHash: type==="deposit" ? txHash : "",
    status: "pending",
    time: serverTimestamp()
  });

  await updateDoc(userRef,{ pendingRequest:true });

  alert("Request submitted. Await admin approval.");
  render();
};

/* ADMIN PANEL (UNCHANGED LOGIC) */
function adminPanel(){
  return `
    <hr><h3>Admin Panel</h3>

    <input id="aw" placeholder="User Wallet (TG_xxx)" />
    <input id="aa" type="number" placeholder="Amount" />
    <button onclick="adminCredit()">Admin Deposit</button>
    <button onclick="adminWithdraw()">Admin Withdraw</button>

    <hr><h4>View Any User History</h4>
    <input id="vh" placeholder="User Wallet (TG_xxx)" />
    <button onclick="viewUserHistory()">View History</button>
    <div id="userHistory"></div>

    <hr><h4>Pending Deposit / Withdraw</h4>
    <button onclick="loadRequests()">Refresh</button>
    <div id="reqList"></div>
  `;
}

/* VIEW USER HISTORY */
window.viewUserHistory = async ()=>{
  const w = vh.value.trim();
  if(!w) return;
  const ref = doc(db,"users",w);
  const snap = await getDoc(ref);
  if(!snap.exists()) return alert("User not found");

  userHistory.innerHTML =
    (snap.data().history||[]).slice().reverse().map(tx=>`
      <div class="tx">
        <b>${tx.type}</b>: ${tx.amount} USDC<br>
        <span class="small">${new Date(tx.time).toLocaleString()}</span>
      </div>
    `).join("") || "<p class='small'>No history</p>";
};

/* LOAD REQUESTS */
window.loadRequests = async ()=>{
  const snap = await getDocs(requestsRef);
  let h="";
  snap.forEach(d=>{
    const r=d.data();
    if(r.status!=="pending") return;
    h+=`
      <div class="tx">
        <b>${r.type.toUpperCase()}</b><br>
        User: ${r.user}<br>
        Amount: ${r.amount}<br>
        Wallet: ${r.walletAddress}<br>
        Hash: ${r.txHash||"-"}<br>
        <span class="small">
          ${r.time?.toDate ? r.time.toDate().toLocaleString() : ""}
        </span>
      </div>`;
  });
  reqList.innerHTML = h || "<p class='small'>No pending</p>";
};

/* UTIL */
function appDiv(html){ document.getElementById("app").innerHTML = html; }

init();
</script>
</body>
</html>
