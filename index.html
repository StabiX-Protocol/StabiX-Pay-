<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; font-size:15px; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    button:disabled { background:#334155; cursor:not-allowed; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; margin-top:8px; padding-bottom:8px; border-bottom:1px dashed #1e293b; }
    .warn { color:#facc15; font-size:13px; margin-top:10px; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  arrayUnion, collection, addDoc, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* ---------- FIREBASE ---------- */

const firebaseConfig = {
  apiKey: "AIzaSyBWWPgitPhLIYbR-ZmezpaP155cpn1_KPY",
  authDomain: "stabix-49cc6.firebaseapp.com",
  projectId: "stabix-49cc6",
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* ---------- TELEGRAM ---------- */

const tg = window.Telegram?.WebApp;
tg?.ready();

const ADMIN_TG_ID = "1303497305";
const tgUser = tg?.initDataUnsafe?.user || { id:"browser" };

const wallet = "TG_" + tgUser.id;
const userRef = doc(db,"users",wallet);
const requestsRef = collection(db,"requests");

/* ---------- HELPERS ---------- */

function appDiv(html){
  document.getElementById("app").innerHTML = html;
}

function safeTime(t){
  if(!t) return Date.now();
  if(typeof t === "number") return t;
  if(t.toMillis) return t.toMillis();
  return Date.now();
}

/* ---------- INIT ---------- */

async function init(){
  try{
    const snap = await getDoc(userRef);

    if(!snap.exists()){
      showSetup();
    } else {
      render();
    }
  }catch(e){
    appDiv(`<div class="box">❌ Firestore Error</div>`);
    console.error(e);
  }
}

/* ---------- SETUP ---------- */

function showSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Username</h3>
      <input id="uname" placeholder="Username">
      <button onclick="saveUsername()">Save</button>
    </div>
  `);
}

window.saveUsername = async ()=>{
  const name = uname.value.trim();
  if(!name) return alert("Enter username");

  appDiv(`<div class="box">Saving…</div>`);

  await setDoc(userRef,{
    username: name,
    balance: 0,
    history: [],
    pendingRequest: false
  });

  // ❗ SAFE FLOW (no render here)
  setTimeout(init, 300);
};

/* ---------- SEND (DUMMY TO PREVENT CRASH) ---------- */

window.send = ()=>{
  alert("Send feature coming soon");
};

/* ---------- RENDER ---------- */

async function render(){
  const snap = await getDoc(userRef);
  const user = snap.data();
  const locked = user.pendingRequest === true;
  const isAdmin = String(tgUser.id) === ADMIN_TG_ID;

  let grouped = {};
  (user.history || []).forEach(tx=>{
    const d = new Date(safeTime(tx.time)).toISOString().slice(0,10);
    grouped[d] = grouped[d] || [];
    grouped[d].push(tx);
  });

  let historyHtml = "";
  Object.keys(grouped).sort().reverse().forEach(date=>{
    historyHtml += `<hr><b>${date}</b>`;
    grouped[date].reverse().forEach(tx=>{
      historyHtml += `
        <div class="tx">
          <b>${tx.type}</b>: ${tx.amount} USDC<br>
          <span class="small">${new Date(safeTime(tx.time)).toLocaleString()}</span>
        </div>`;
    });
  });

  if(!historyHtml) historyHtml = "<p class='small'>No transactions</p>";

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${wallet}</p>

      <hr><h3>Balance</h3>
      <b>${Number(user.balance).toFixed(2)} USDC</b>

      ${locked?`<div class="warn">⏳ Pending admin approval</div>`:""}

      <hr><h3>Send USDC</h3>
      <button onclick="send()">Send</button>

      <hr><h3>Transaction History</h3>
      ${historyHtml}

      ${isAdmin?`<hr><b>Admin Mode Enabled</b>`:""}
    </div>
  `);
}

/* ---------- START ---------- */

setTimeout(init, 300);
</script>
</body>
</html>
