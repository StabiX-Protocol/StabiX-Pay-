<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp,
  query, where, orderBy, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1"
};
const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);

/* ================= TELEGRAM ================= */
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const tgUser = tg.initDataUnsafe?.user;
const WALLET = "TG_" + tgUser.id;

const userRef = doc(db,"users",WALLET);
const validatorRef = doc(db,"validators",String(tgUser.id));

/* ================= SEND USDC ================= */
window.sendUSDC = async ()=>{
  const toWallet = sendTo.value.trim();
  const amount = Number(sendAmt.value);
  if(!toWallet || amount <= 0) return alert("Invalid input");

  if(toWallet === WALLET){
    tg.showPopup({ title:"Invalid Transaction", message:"You cannot send USDC to your own wallet.", buttons:[{type:"ok"}] });
    return;
  }

  const toRef = doc(db,"users",toWallet);

  await runTransaction(db, async (tx)=>{
    const fromSnap = await tx.get(userRef);
    const toSnap = await tx.get(toRef);

    if(!toSnap.exists()) throw "Receiver not found";
    if(fromSnap.data().balance < amount) throw "Insufficient balance";

    tx.update(userRef,{ balance: fromSnap.data().balance - amount });
    tx.update(toRef,{ balance: toSnap.data().balance + amount });

    const now = serverTimestamp();

    tx.set(doc(collection(db,"transactions")),{
      userId: WALLET,
      type: "send",
      amount,
      from: WALLET,
      to: toWallet,
      createdAt: now
    });

    tx.set(doc(collection(db,"transactions")),{
      userId: toWallet,
      type: "receive",
      amount,
      from: WALLET,
      to: toWallet,
      createdAt: now
    });
  });

  alert("Transfer successful");
  renderApp();
};

/* ================= VALIDATOR POWER ================= */
window.validatorAdjust = async ()=>{
  const uid = vUser.value.trim();
  const amt = Number(vAmt.value);
  if(!uid || amt <= 0) return alert("Invalid input");

  const targetRef = doc(db,"users",uid);

  await runTransaction(db, async (tx)=>{
    const snap = await tx.get(targetRef);
    if(!snap.exists()) throw "User not found";

    const bal = snap.data().balance;
    const newBal = vType.value === "deposit" ? bal + amt : bal - amt;
    tx.update(targetRef,{ balance:newBal });

    tx.set(doc(collection(db,"transactions")),{
      userId: uid,
      type: "validator-"+vType.value,
      amount: amt,
      from: "VALIDATOR",
      to: uid,
      createdAt: serverTimestamp()
    });
  });

  alert("Balance updated");
};

/* ================= HISTORY ================= */
async function loadHistory(){
  const q = query(
    collection(db,"transactions"),
    where("userId","==",WALLET),
    orderBy("createdAt","desc")
  );

  const snap = await getDocs(q);
  let html="";

  snap.forEach(d=>{
    const t = d.data();
    const time = t.createdAt?.toDate?.().toLocaleString() || "";
    html += `
      <div class="tx">
        <b>${t.type}</b> | ${t.amount} USDC<br>
        From: ${t.from || "-"}<br>
        To: ${t.to || "-"}<br>
        <span class="small">${time}</span>
      </div>
    `;
  });

  history.innerHTML = html || "No history";
}
</script>
</body>
</html>
