<!DOCTYPE html>
<html>
<head>
  <title>StabiX Ledger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family: Arial, sans-serif;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:12px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
    h2,h3 {
      margin-top:0;
    }
    input, button {
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:none;
      font-size:15px;
    }
    button {
      background:#2563eb;
      color:white;
      font-weight:bold;
    }
    button.secondary {
      background:#1e293b;
    }
    .small {
      font-size:12px;
      opacity:0.75;
      margin-top:10px;
    }
    hr {
      border:0;
      border-top:1px solid #1e293b;
      margin:15px 0;
    }
    ul {
      padding-left:18px;
    }
    li {
      font-size:14px;
      margin-bottom:6px;
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>
/* ===============================
   STATE
================================ */
let balance = 0;
let transactions = [];

/* ===============================
   CHECK REGISTRATION
================================ */
const wallet = localStorage.getItem("stabix_wallet");
const username = localStorage.getItem("stabix_username");

/* ===============================
   DASHBOARD
================================ */
if (wallet && username) {

  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>Welcome, ${username}</h2>

      <p class="small"><b>Wallet</b><br>${wallet}</p>

      <hr>

      <h3>Balance</h3>
      <p>USDC: <b><span id="balance">0.00</span></b></p>

      <hr>

      <h3>Send USDC</h3>
      <input id="toUser" placeholder="Recipient Username" />
      <input id="amount" type="number" placeholder="Amount" />
      <button onclick="sendUSDC()">Send</button>

      <hr>

      <h3>Transaction History</h3>
      <ul id="txList">
        <li>No transactions yet</li>
      </ul>

      <hr>

      <p class="small">
        🔐 Secure internal ledger<br>
        ⚡ Instant transfers<br>
        📊 Balance updates in real-time
      </p>

      <button class="secondary" onclick="logout()">Logout</button>
    </div>
  `;

  updateUI();
}

/* ===============================
   REGISTRATION
================================ */
else {
  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>Register on StabiX</h2>

      <input id="walletInput" placeholder="Wallet Address" />
      <input id="usernameInput" placeholder="Choose Username (one-time)" />

      <button onclick="register()">Register</button>

      <p class="small">
        ⚠️ Username cannot be changed later
      </p>
    </div>
  `;
}

/* ===============================
   FUNCTIONS
================================ */
function register() {
  const w = document.getElementById("walletInput").value.trim();
  const u = document.getElementById("usernameInput").value.trim();

  if (!w || !u) {
    alert("Fill all fields");
    return;
  }

  localStorage.setItem("stabix_wallet", w);
  localStorage.setItem("stabix_username", u);

  alert("Registered Successfully");
  location.reload();
}

function sendUSDC() {
  const to = document.getElementById("toUser").value.trim();
  const amt = Number(document.getElementById("amount").value);

  if (!to || amt <= 0) {
    alert("Invalid input");
    return;
  }

  if (balance < amt) {
    alert("Insufficient balance");
    return;
  }

  balance -= amt;
  transactions.unshift(`Sent ${amt} USDC to @${to}`);
  updateUI();
}

function updateUI() {
  document.getElementById("balance").innerText = balance.toFixed(2);

  const txList = document.getElementById("txList");
  txList.innerHTML = "";

  if (transactions.length === 0) {
    txList.innerHTML = "<li>No transactions yet</li>";
    return;
  }

  transactions.forEach(tx => {
    const li = document.createElement("li");
    li.innerText = tx;
    txList.appendChild(li);
  });
}

function logout() {
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
