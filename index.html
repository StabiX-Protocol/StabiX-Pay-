<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
    .link { color:#60a5fa; font-size:13px; cursor:pointer; margin-top:10px; display:block; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp,
  query, where, orderBy, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1",
  storageBucket: "stabix-backend-v1.firebasestorage.app",
  messagingSenderId: "351361221507",
  appId: "1:351361221507:web:ebaf0d15e86d4b184c6cb6"
};

const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);

/* ================= TELEGRAM ================= */
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const tgUser = tg.initDataUnsafe?.user;
if(!tgUser?.id){ app.innerHTML="Telegram user not found"; throw ""; }

/* ================= IDENTITY ================= */
const WALLET = "TG_" + tgUser.id;
const userRef = doc(db,"users",WALLET);
const validatorRef = doc(db,"validators",String(tgUser.id));
let OTP_CODE = null;

/* ================= INIT ================= */
async function init(){
  const snap = await getDoc(userRef);
  if(!snap.exists()){ renderSetup(); return; }
  renderLogin();
}

/* ================= SETUP ================= */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Username</h3>
      <input id="uname" placeholder="Username">
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="saveProfile()">Save</button>
    </div>
  `);
}

window.saveProfile = async ()=>{
  await setDoc(userRef,{
    username: uname.value,
    password: pwd.value,
    walletAddress: WALLET,
    balance: 0,
    createdAt: serverTimestamp()
  });
  renderApp();
};

/* ================= LOGIN ================= */
function renderLogin(){
  appDiv(`
    <div class="box">
      <h3>Enter Password</h3>
      <input id="pwd" type="password">
      <button onclick="login()">Login</button>
    </div>
  `);
}

window.login = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().password !== pwd.value) return alert("Wrong password");
  renderApp();
};

/* ================= MAIN ================= */
async function renderApp(){
  const user = (await getDoc(userRef)).data();
  const isValidator = (await getDoc(validatorRef)).exists();

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>
      <b>Balance:</b> ${user.balance} USDC
      <hr>
      <h3>History</h3>
      <div id="history">Loading…</div>
      ${isValidator ? validatorPanel() : ""}
    </div>
  `);

  loadHistory();
}

/* ================= HISTORY ================= */
async function loadHistory(){
  const q = query(collection(db,"transactions"),
    where("userId","==",WALLET),
    orderBy("createdAt","desc"));
  const snap = await getDocs(q);
  let h="";
  snap.forEach(d=>h+=`<div class="tx">${d.data().type} - ${d.data().amount}</div>`);
  history.innerHTML = h || "No history";
}

/* ================= VALIDATOR PANEL ================= */
function validatorPanel(){
  return `
  <hr>
  <h3>Validator Panel</h3>

  <input id="vWallet" placeholder="Target Wallet (TG_xxx)">
  <input id="vAmt" type="number" placeholder="Amount">
  <select id="vType">
    <option value="deposit">Deposit</option>
    <option value="withdraw">Withdraw</option>
  </select>
  <button onclick="validatorExecute()">Execute</button>

  <hr>
  <button onclick="loadRequests()">Load Requests</button>
  <div id="vout"></div>
  `;
}

/* ===== VALIDATOR FORCE DEPOSIT / WITHDRAW ===== */
window.validatorExecute = async ()=>{
  const w = vWallet.value.trim();
  const amt = Number(vAmt.value);
  const type = vType.value;
  if(!w || !amt) return alert("Invalid input");

  const targetRef = doc(db,"users",w);
  await runTransaction(db, async(tx)=>{
    const snap = await tx.get(targetRef);
    if(!snap.exists()) throw "User not found";

    let bal = snap.data().balance;
    bal = type==="deposit" ? bal + amt : bal - amt;

    tx.update(targetRef,{ balance: bal });

    tx.set(doc(collection(db,"transactions")),{
      userId: w,
      type: "validator_"+type,
      amount: amt,
      by: WALLET,
      createdAt: serverTimestamp()
    });
  });

  alert("Success");
};

/* ================= REQUEST VIEW ================= */
window.loadRequests = async ()=>{
  const snap = await getDocs(collection(db,"requests"));
  let html="";
  snap.forEach(d=>{
    if(d.data().status==="pending")
      html+=`<div class="tx">${d.data().userId} - ${d.data().amount}</div>`;
  });
  vout.innerHTML = html || "No pending";
};

/* ================= UTIL ================= */
function appDiv(h){ app.innerHTML=h; }
init();
</script>
</body>
</html>
