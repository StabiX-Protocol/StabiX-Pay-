<body>

<script type="module">

const appFB = initializeApp(firebaseConfig);

/* ================= TELEGRAM ================= */

/* ================= SETUP ================= */

    </div>/* ================= SETUP ================= */
window.saveProfile = async ()=>{
  if(!uname.value.trim() || !pwd.value.trim())
    return alert("Enter username & password");

  await setDoc(userRef,{
    username: uname.value.trim(),
    password: pwd.value.trim(),
    walletAddress: WALLET,
    balance: 0,
    pendingRequest:false,
    lastUsernameChange: serverTimestamp(),
    createdAt: serverTimestamp()
  });

  renderApp();
};

/* ================= LOGIN UI ================= */
function renderLogin(){
  appDiv(`
    <div class="box">
      <h3>Login</h3>
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <button onclick="forgotPassword()">Forgot Password?</button>
    </div>
  `);
}

/* ================= INIT ================= */
async function init(){
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    renderSetup();
    return;
  }

  if(!snap.data().password){
    renderSetup();
    return;
  }

  renderLogin();
}

/* ================= LOGIN LOGIC ================= */
window.login = async ()=>{
  const snap = await getDoc(userRef);

  if(snap.data().password !== pwd.value.trim())
    return alert("Wrong password");

  renderApp();
};

/* ================= FORGOT PASSWORD ================= */
window.forgotPassword = async ()=>{
  const otp = Math.floor(100000 + Math.random() * 900000).toString();

  await updateDoc(userRef,{
    otp,
    otpAt: serverTimestamp()
  });

  tg.showPopup({
    title:"OTP Sent",
    message:"Your OTP: " + otp,
    buttons:[{type:"ok"}]
  });

  renderOTP();
};

/* ================= OTP UI ================= */
function renderOTP(){
  appDiv(`
    <div class="box">
      <h3>Reset Password</h3>
      <input id="otp" placeholder="OTP">
      <input id="npwd" type="password" placeholder="New Password">
      <button onclick="verifyOTP()">Reset</button>
      <button onclick="forgotPassword()">Resend OTP</button>
    </div>
  `);
}

/* ================= VERIFY OTP ================= */
window.verifyOTP = async ()=>{
  const snap = await getDoc(userRef);

  if(snap.data().otp !== otp.value.trim())
    return alert("Invalid OTP");

  await updateDoc(userRef,{
    password: npwd.value.trim(),
    otp: ""
  });

  alert("Password updated");
  renderLogin();
};

  
  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>
      <button onclick="changeUsername()">Change Username</button>

      <hr>
      <b>Balance:</b> ${user.balance.toFixed(2)} USDC
      ${user.pendingRequest ? `<div class="warn">Pending approval</div>` : ""}

      <hr>
      <h3>Send USDC</h3>
      <input id="sendTo" placeholder="Receiver Wallet (TG_xxx)">
      <input id="sendAmt" type="number" placeholder="Amount">
      <button onclick="sendUSDC()">Send</button>

      <hr>
      <h3>Deposit / Withdraw</h3>
      <select id="type">
        <option value="deposit">Deposit</option>
        <option value="withdraw">Withdraw</option>
      </select>
      <input id="amt" type="number" placeholder="Amount">
      <input id="waddr" placeholder="Wallet Address">
      <input id="txh" placeholder="Tx Hash (deposit only)">
      <button onclick="submitReq()">Submit</button>

      <hr>
      <h3>Transaction History</h3>
      <div id="history">Loading…</div>

      ${isValidator ? validatorPanel() : ""}
    </div>
  `);

  loadHistory();
}

/* ================= SEND USDC ================= */
window.sendUSDC = async ()=>{
  const toWallet = sendTo.value.trim();
  const amount = Number(sendAmt.value);

  if(!toWallet || amount<=0) return alert("Invalid input");

  if(toWallet === WALLET){
    tg.showPopup({
      title:"Transaction Blocked",
      message:"You cannot send USDC to your own wallet",
      buttons:[{type:"ok"}]
    });
    return;
  }

  try{
    await runTransaction(db, async(tx)=>{
      const fromSnap = await tx.get(userRef);
      const toRef = doc(db,"users",toWallet);
      const toSnap = await tx.get(toRef);

      if(!toSnap.exists()) throw "Receiver not found";
      if(fromSnap.data().balance < amount) throw "Insufficient balance";

      tx.update(userRef,{balance:fromSnap.data().balance-amount});
      tx.update(toRef,{balance:toSnap.data().balance+amount});

      tx.set(doc(collection(db,"transactions")),{
        userId: WALLET,
        type:"sent",
        amount,
        counterparty: toWallet,
        createdAt: serverTimestamp()
      });

      tx.set(doc(collection(db,"transactions")),{
        userId: toWallet,
        type:"received",
        amount,
        counterparty: WALLET,
        createdAt: serverTimestamp()
      });
    });

    renderApp();
  }catch(e){
    alert(e);
  }
};

/* ================= USER REQUEST ================= */
window.submitReq = async ()=>{
  await addDoc(collection(db,"requests"),{
    userId: WALLET,
    amount: Number(amt.value),
    type: type.value,
    walletAddress: waddr.value,
    txHash: type.value==="deposit" ? txh.value : "",
    status:"pending",
    createdAt: serverTimestamp()
  });

  await updateDoc(userRef,{pendingRequest:true});
  alert("Request submitted");
};

/* ================= USER HISTORY ================= */
async function loadHistory(){
  const q = query(
    collection(db,"transactions"),
    where("userId","==",WALLET),
    orderBy("createdAt","desc")
  );
  const snap = await getDocs(q);

  let html="";
  snap.forEach(d=>{
    const t=d.data();
    html+=`
      <div class="tx">
        <b>${t.type}</b> ${t.amount} USDC<br>
        <span class="small">${t.createdAt.toDate().toLocaleString()}</span>
      </div>`;
  });

  document.getElementById("history").innerHTML = html || "No history";
}

/* ================= VALIDATOR ================= */
function validatorPanel(){
  return `
    <hr>
    <h3>Validator Panel</h3>
    <button onclick="loadRequests()">Load ALL Pending Requests</button>
    <div id="vout"></div>
  `;
}

/* ================= LOAD ALL PENDING ================= */
window.loadRequests = async ()=>{
  const q = query(
    collection(db,"requests"),
    where("status","==","pending"),
    orderBy("createdAt","asc")
  );

  const snap = await getDocs(q);
  if(snap.empty){
    vout.innerHTML = "<p class='small'>No pending requests</p>";
    return;
  }

  let html="<hr>";
  snap.forEach(d=>{
    const r=d.data();
    html+=`
      <div class="tx">
        <b>${r.type.toUpperCase()}</b><br>
        User: ${r.userId}<br>
        Amount: ${r.amount}<br>
        <button onclick="approveReq('${d.id}','${r.userId}',${r.amount},'${r.type}')">Approve</button>
        <button onclick="rejectReq('${d.id}','${r.userId}')">Reject</button>
      </div>
    `;
  });

  vout.innerHTML = html;
};

/* ================= APPROVE ================= */
window.approveReq = async (reqId,userId,amount,type)=>{
  const uref = doc(db,"users",userId);
  const usnap = await getDoc(uref);
  if(!usnap.exists()) return alert("User not found");

  let bal = usnap.data().balance;
  bal = type==="deposit" ? bal+amount : bal-amount;
  if(bal < 0) return alert("Insufficient balance");

  await updateDoc(uref,{balance:bal,pendingRequest:false});

  await addDoc(collection(db,"transactions"),{
    userId,
    type,
    amount,
    direction:type==="deposit"?"credit":"debit",
    counterparty:"VALIDATOR",
    createdAt: serverTimestamp()
  });

  await updateDoc(doc(db,"requests",reqId),{status:"approved"});
  loadRequests();
};

/* ================= REJECT ================= */
window.rejectReq = async (reqId,userId)=>{
  await updateDoc(doc(db,"requests",reqId),{status:"rejected"});
  await updateDoc(doc(db,"users",userId),{pendingRequest:false});
  loadRequests();
};

/* ================= UTIL ================= */
function appDiv(h){
  document.getElementById("app").innerHTML = h;
}

init();
</script>
</body>
