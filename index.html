<!DOCTYPE html>
<html>
<head>
  <title>StabiX Pay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family: Arial;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:14px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:15px;
    }
    button {
      background:#2563eb;
      color:white;
      font-weight:bold;
    }
    hr {
      border:0;
      border-top:1px solid #1e293b;
      margin:16px 0;
    }
    .tx {
      font-size:13px;
      margin-top:10px;
      padding:10px;
      background:#020617;
      border-radius:8px;
      border:1px solid #1e293b;
    }
    .small { opacity:0.7; font-size:12px; }
  </style>
</head>

<body>
<div id="app"></div>

<script>
/* ================= TELEGRAM INIT ================= */
const tg = window.Telegram?.WebApp;
tg?.ready();

const tgUser = tg?.initDataUnsafe?.user || {
  id: "browser_user",
  first_name: "Browser"
};

const WALLET = "TG_" + tgUser.id;
const ADMIN_TG_ID = "1303497305"; // <- apna TG numeric ID

/* ================= STORAGE ================= */
let users = JSON.parse(localStorage.getItem("stabix_users") || "{}");
let txs   = JSON.parse(localStorage.getItem("stabix_txs") || "[]");

/* ================= FIRST TIME USER ================= */
if (!users[WALLET]) {
  renderUsername();
} else {
  renderApp();
}

/* ================= UI ================= */
function renderUsername() {
  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>Welcome</h2>
      <p class="small">Set username (only once)</p>
      <input id="uname" placeholder="Username" />
      <button onclick="saveUsername()">Continue</button>
    </div>
  `;
}

function renderApp() {
  const user = users[WALLET];
  const isAdmin = String(tgUser.id) === ADMIN_TG_ID;

  const history = txs
    .filter(t => t.from === WALLET || t.to === WALLET)
    .reverse()
    .map(t => `
      <div class="tx">
        <b>${t.type}</b> ${t.amount} USDC<br>
        <span class="small">${new Date(t.time).toLocaleString()}</span>
      </div>
    `).join("") || `<p class="small">No transactions yet</p>`;

  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>

      <hr>
      <h3>Balance</h3>
      <b>${user.balance.toFixed(2)} USDC</b>

      <hr>
      <h3>Send USDC</h3>
      <input id="to" placeholder="Receiver Wallet (TG_123)" />
      <input id="amt" type="number" placeholder="Amount" />
      <button onclick="send()">Send</button>

      <hr>
      <h3>History</h3>
      ${history}

      ${isAdmin ? adminPanel() : ""}
    </div>
  `;
}

function adminPanel() {
  return `
    <hr>
    <h3>Admin Panel</h3>
    <input id="aw" placeholder="User Wallet" />
    <input id="aa" type="number" placeholder="Amount" />
    <button onclick="addBalance()">Add Balance</button>
  `;
}

/* ================= ACTIONS ================= */
function saveUsername() {
  const u = document.getElementById("uname").value.trim();
  if (!u) return alert("Username required");

  users[WALLET] = { username: u, balance: 0 };
  save();
  renderApp();
}

function send() {
  const to = document.getElementById("to").value.trim();
  const amt = Number(document.getElementById("amt").value);

  if (!users[to]) return alert("User not found");
  if (amt <= 0) return alert("Invalid amount");
  if (users[WALLET].balance < amt) return alert("Insufficient balance");

  users[WALLET].balance -= amt;
  users[to].balance += amt;

  txs.push({
    from: WALLET,
    to,
    amount: amt,
    type: "Sent",
    time: Date.now()
  });

  save();
  renderApp();
}

function addBalance() {
  const w = document.getElementById("aw").value.trim();
  const a = Number(document.getElementById("aa").value);

  if (!users[w] || a <= 0) return alert("Invalid");

  users[w].balance += a;
  txs.push({
    from: "SYSTEM",
    to: w,
    amount: a,
    type: "Admin Credit",
    time: Date.now()
  });

  save();
  renderApp();
}

function save() {
  localStorage.setItem("stabix_users", JSON.stringify(users));
  localStorage.setItem("stabix_txs", JSON.stringify(txs));
}
</script>
</body>
</html>
