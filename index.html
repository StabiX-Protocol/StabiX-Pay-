<!DOCTYPE html>
<html>
<head>
<title>StabiX</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="app">Loading…</div>

<!-- ===== Transaction Popup ===== -->
<div id="txPopup" class="tx-popup">
<div class="tx-card">

<audio id="txSound" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3" type="audio/mpeg">
</audio>

<div class="spinner">
<svg viewBox="0 0 120 120">

<circle class="circle-bg" cx="60" cy="60" r="52"/>

<circle class="circle-progress" cx="60" cy="60" r="52"/>

<polyline id="tick" points="38,65 55,80 82,45"/>

<line id="crossLine1" x1="40" y1="40" x2="80" y2="80"
style="display:none;stroke:#ef4444;stroke-width:10;stroke-linecap:round"/>

<line id="crossLine2" x1="80" y1="40" x2="40" y2="80"
style="display:none;stroke:#ef4444;stroke-width:10;stroke-linecap:round"/>

</svg>
</div>

<div id="txTitle"
style="
font-size:22px;
font-weight:bold;
color:#22c55e;
margin-bottom:10px;
">
Transaction Successful
</div>

<div id="txMsg" style="font-size:16px;"></div>

<div id="txTime" class="small" style="margin-top:6px;"></div>

<button id="txDoneBtn"
style="margin-top:16px;background:#22c55e;color:#022c22;"
onclick="closeTxPopup(); window.goHome();">
DONE
</button>

</div>
</div>
  
 <!-- ===== Sending UI===== -->
<div id="sendScreen">
<div class="sendHeader">
<button onclick="closeSend()" class="backBtn">
  ←
</button>
<h2>Send USDC</h2>
</div>
<div class="sendBody">
<h1 class="sendTitle">Receiving address</h1>
<p class="sendSub">
Enter wallet address or domain name
</p>
<div class="addressBox">
<input
id="sendTo"
placeholder="Enter TG ID (TG_xxx)"
autocomplete="off"
/>
</div>
<button class="nextBtn" onclick="goAmount()">
Next
</button>
</div>

</div>

<div id="amountScreen" style="display:none">
<div class="sendHeader">
<button onclick="backToAddress()" class="backBtn">←</button>
<h2>Send USDC</h2>
</div>
<div class="sendBody">
<div class="sendIcon">⬆</div>
<h1 class="sendTitle">Enter amount</h1>
<input
id="sendAmt"
type="number"
inputmode="decimal"
placeholder="0"
class="amountInput"
/>
<button class="nextBtn" onclick="handleNext()">
Next
</button>
</div>

</div>
  
<div id="confirmScreen" style="display:none">
<div class="sendHeader">
<button onclick="backToAmount()" class="backBtn">←</button>
</div>
<div class="sendBody">
<h1 id="confirmAmount" style="font-size:56px;text-align:center;">
-0 USDC
</h1>
<hr>
<p>Transaction Fee</p>
<p>0 USDC</p>
<p>From</p>
<p id="confirmFrom"></p>
<p>To</p>
<p id="confirmTo"></p>
<div style="margin-top:30px;display:flex;gap:10px">
<button onclick="sendUSDC()" 
style="width:80%;margin:20px auto;padding:14px;background:#22c55e;color:#fff;border:none;border-radius:12px;display:block;">
Confirm
</button>
</button>
</div>
</div>
</div>
             
 <!-- ===== QR Code===== -->
 <script src="https://unpkg.com/html5-qrcode"></script> 

  <div id="scannerOverlay" style="
display:none;
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
z-index:99999;
">

  <div id="qr-reader" style="
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:9999;
"></div>

  <div id="scanBox" style="
  position:fixed;
  top:50%;
  left:50%;
  width:240px;
  height:240px;
  transform:translate(-50%,-50%);
  pointer-events:none;
">
  <!-- 4 corners -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  </div>

  <button onclick="closeScanner()" style="
    position:absolute;
    top:15px;
    left:15px;
    background:rgba(0,0,0,0.7);
    color:#fff;
    border:none;
    font-size:18px;
    width:40px;
    height:40px;
    border-radius:50%;
    z-index:100000;
  ">✕</button>
  
 <button id="torchBtn" onclick="toggleTorch()" style="
  position:absolute;
  top:15px;
  right:15px;
  background:rgba(0,0,0,0.7);
  color:#fff;
  border:none;
  font-size:18px;
  width:40px;
  height:40px;
  border-radius:50%;
  z-index:100000;
">
🔦
  </button>
    
 </div>


  
  <script type="module" src="./js/app.js"></script>
  
 <!-- ===== Error Tool===== -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<script>
window.onerror = function(msg, url, line, col, error) {
  console.log("❌ ERROR:", msg);
  console.log("📍 File:", url);
  console.log("📌 Line:", line, "Column:", col);
};
</script>


  
</body>
</html>
