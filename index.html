<!DOCTYPE html>
<html>
<head>
<title>StabiX</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="app">Loading…</div>

<!-- ===== Transaction Popup ===== -->
<div id="txPopup" class="tx-popup">
<div class="tx-card">

<audio id="txSound" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3" type="audio/mpeg">
</audio>

<div class="spinner">
<svg viewBox="0 0 120 120">

<circle class="circle-bg" cx="60" cy="60" r="52"/>

<circle class="circle-progress" cx="60" cy="60" r="52"/>

<polyline id="tick" points="38,65 55,80 82,45"/>

<line id="crossLine1" x1="40" y1="40" x2="80" y2="80"
style="display:none;stroke:#ef4444;stroke-width:10;stroke-linecap:round"/>

<line id="crossLine2" x1="80" y1="40" x2="40" y2="80"
style="display:none;stroke:#ef4444;stroke-width:10;stroke-linecap:round"/>

</svg>
</div>

<div id="txTitle"
style="
font-size:22px;
font-weight:bold;
color:#22c55e;
margin-bottom:10px;
">
Transaction Successful
</div>

<div id="txMsg" style="font-size:16px;"></div>

<div id="txTime" class="small" style="margin-top:6px;"></div>

<button id="txDoneBtn"
style="margin-top:16px;background:#22c55e;color:#022c22;font-weight:bold;display:none"
onclick="closeTxPopup()">
DONE
</button>

</div>
</div>
  
 <!-- ===== Sending UI===== -->
<div id="sendScreen">
<div class="sendHeader">
<button onclick="closeSend()" class="backBtn">
  ←
</button>
<h2>Send USDC</h2>
</div>
<div class="sendBody">
<h1 class="sendTitle">Receiving address</h1>
<p class="sendSub">
Enter wallet address or domain name
</p>
<div class="addressBox">
<input
id="sendTo"
placeholder="Enter TG ID (TG_xxx)"
autocomplete="off"
/>
</div>
<button class="nextBtn" onclick="goAmount()">
Next
</button>
</div>

</div>

<div id="amountScreen" style="display:none">
<div class="sendHeader">
<button onclick="backToAddress()">←</button>
<h2>Send USDC</h2>
</div>
<div class="sendBody">
<div class="sendIcon">⬆</div>
<h1 class="sendTitle">Enter amount</h1>
<input
id="sendAmt"
type="number"
inputmode="decimal"
placeholder="0"
class="amountInput"
/>
<button class="nextBtn" onclick="openConfirm()">
Next
</button>
</div>

</div>
  
<div id="confirmScreen" style="display:none">
<div class="sendHeader">
<button onclick="backToAmount()">←</button>
</div>
<div class="sendBody">
<h1 id="confirmAmount">-0 USDC</h1>
<hr>
<p>Transaction Fee</p>
<p>0 USDC</p>
<p>From</p>
<p id="confirmFrom"></p>
<p>To</p>
<p id="confirmTo"></p>
<div style="margin-top:30px;display:flex;gap:10px">
<button onclick="backToAmount()" style="flex:1;padding:14px">
Reject
</button>
<button onclick="confirmSend()" style="flex:1;padding:14px;background:#22c55e;color:#022c22">
Confirm
</button>
</div>
</div>
</div>

<script type="module" src="./js/app.js"></script>
  
 <!-- ===== Error Tool===== -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
  
</body>
</html>
