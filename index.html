<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StabiX Step-1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family: Arial;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:12px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
    button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:15px;
      background:#2563eb;
      color:white;
      font-weight:bold;
    }
    .small {
      font-size:12px;
      opacity:0.7;
      margin-top:8px;
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
/* ===== TELEGRAM INIT ===== */
const tg = window.Telegram.WebApp;
tg.ready();

/* ===== USER ===== */
const user = tg.initDataUnsafe.user;
const USER_KEY = "stabix_data";

/* ===== CLOUD STORAGE ===== */
const cs = tg.CloudStorage;

/* ===== UI ===== */
document.getElementById("app").innerHTML = `
  <div class="box">
    <h2>Hello ${user.first_name}</h2>
    <p class="small">TG ID: ${user.id}</p>

    <button onclick="saveData()">Save Test Data</button>
    <button onclick="loadData()">Load Data</button>

    <div id="output" class="small"></div>
  </div>
`;

/* ===== SAVE ===== */
function saveData() {
  const data = {
    balance: 100,
    history: [
      {
        type: "credit",
        amount: 100,
        time: Date.now()
      }
    ]
  };

  cs.setItem(USER_KEY, JSON.stringify(data), (ok, err) => {
    document.getElementById("output").innerText =
      ok ? "✅ Data Saved Successfully" : "❌ Save Failed";
  });
}

/* ===== LOAD ===== */
function loadData() {
  cs.getItem(USER_KEY, (value, err) => {
    if (!value) {
      document.getElementById("output").innerText = "⚠️ No data found";
      return;
    }

    const data = JSON.parse(value);
    document.getElementById("output").innerText =
      "Balance: " + data.balance +
      "\nLast Tx Amount: " + data.history[0].amount;
  });
}
</script>
</body>
</html>
