<!DOCTYPE html>
<html>
<head>
  <title>StabiX Pay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px }
    .box { background:#020617; border-radius:14px; padding:20px; max-width:420px; margin:auto }
    input,button { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none }
    button { background:#2563eb; color:white; font-weight:bold }
    .tx { font-size:13px; margin-top:8px }
    .small { font-size:12px; opacity:.7 }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0 }
  </style>
</head>

<body>
<div id="app">Loading...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc,
  updateDoc, collection, addDoc,
  query, where, orderBy, getDocs
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBWWPgitPhLIYbR-ZmezpaP155cpn1_KPY",
  authDomain: "stabix-49cc6.firebaseapp.com",
  projectId: "stabix-49cc6",
  storageBucket: "stabix-49cc6.appspot.com",
  messagingSenderId: "68502925473",
  appId: "1:68502925473:web:86959dae39a377413800e0"
};

const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);

const tg = window.Telegram.WebApp;
tg.ready();

const ADMIN_TG_ID = "1303497305";

const tgUser = tg.initDataUnsafe.user;
const wallet = "TG_" + tgUser.id;

const userRef = doc(db, "users", wallet);

async function init() {
  const snap = await getDoc(userRef);
  if (!snap.exists()) {
    await setDoc(userRef, {
      username: tgUser.username || "User",
      balance: 0,
      created: Date.now()
    });
  }
  render();
}

async function render() {
  const snap = await getDoc(userRef);
  const user = snap.data();

  const txRef = collection(db, "txs");
  const q = query(
    txRef,
    where("users", "array-contains", wallet),
    orderBy("time", "desc")
  );
  const txSnap = await getDocs(q);

  let history = "";
  txSnap.forEach(d => {
    const t = d.data();
    history += `
      <div class="tx">
        ${t.from} → ${t.to} : ${t.amount} USDC<br>
        <span class="small">${new Date(t.time).toLocaleString()}</span>
      </div>
    `;
  });

  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${wallet}</p>

      <hr>
      <b>Balance: ${user.balance} USDC</b>

      <hr>
      <input id="to" placeholder="Receiver wallet (TG_xxx)">
      <input id="amt" type="number" placeholder="Amount">
      <button onclick="send()">Send</button>

      <hr>
      <h3>History</h3>
      ${history || "<p class='small'>No transactions</p>"}

      ${tgUser.id == ADMIN_TG_ID ? adminPanel() : ""}
    </div>
  `;
}

window.send = async function () {
  const to = document.getElementById("to").value.trim();
  const amt = Number(document.getElementById("amt").value);

  if (!to || amt <= 0) return alert("Invalid");

  const fromSnap = await getDoc(userRef);
  if (fromSnap.data().balance < amt) return alert("No balance");

  const toRef = doc(db, "users", to);
  const toSnap = await getDoc(toRef);
  if (!toSnap.exists()) return alert("Receiver not found");

  await updateDoc(userRef, { balance: fromSnap.data().balance - amt });
  await updateDoc(toRef, { balance: toSnap.data().balance + amt });

  await addDoc(collection(db, "txs"), {
    from: wallet,
    to,
    amount: amt,
    users: [wallet, to],
    time: Date.now()
  });

  render();
};

function adminPanel() {
  return `
    <hr>
    <h3>Admin Panel</h3>
    <input id="aw" placeholder="User wallet">
    <input id="aa" type="number" placeholder="Amount">
    <button onclick="mint()">Add Balance</button>
  `;
}

window.mint = async function () {
  const w = document.getElementById("aw").value.trim();
  const a = Number(document.getElementById("aa").value);

  const ref = doc(db, "users", w);
  const snap = await getDoc(ref);
  if (!snap.exists()) return alert("User not found");

  await updateDoc(ref, { balance: snap.data().balance + a });

  await addDoc(collection(db, "txs"), {
    from: "SYSTEM",
    to: w,
    amount: a,
    users: [w],
    time: Date.now()
  });

  render();
};

init();
</script>
</body>
</html>
