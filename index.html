<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family:Arial;
      padding:20px;
      -webkit-text-size-adjust:100%;
    }

    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:12px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }

    input, button, select {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:16px;
    }

    button {
      background:#2563eb;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    hr {
      border:0;
      border-top:1px solid #1e293b;
      margin:15px 0;
    }

    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
    .warn { color:#facc15; font-size:13px; }
    .link { color:#60a5fa; font-size:13px; cursor:pointer; margin-top:10px; display:block; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp,
  query, where, orderBy, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1",
  storageBucket: "stabix-backend-v1.firebasestorage.app",
  messagingSenderId: "351361221507",
  appId: "1:351361221507:web:ebaf0d15e86d4b184c6cb6"
};

const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);

/* ================= TELEGRAM ================= */
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const tgUser = tg.initDataUnsafe?.user;
if(!tgUser || !tgUser.id){
  document.getElementById("app").innerHTML = "Telegram user not found";
  throw "";
}

/* ================= IDENTITY ================= */
const WALLET = "TG_" + tgUser.id;
const userRef = doc(db,"users",WALLET);
const validatorRef = doc(db,"validators",String(tgUser.id));

let OTP_CODE = null;

/* ================= INIT ================= */
async function init(){
  const snap = await getDoc(userRef);
  if(!snap.exists()){ renderSetup(); return; }
  if(!snap.data().password){ renderSetPassword(); return; }
  renderLogin();
}

/* ================= SETUP ================= */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Username</h3>
      <input id="uname" placeholder="Username">
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="saveProfile()">Save</button>
    </div>
  `);
}

window.saveProfile = async ()=>{
  if(!uname.value.trim() || !pwd.value.trim()) return alert("Fill all fields");
  await setDoc(userRef,{
    username: uname.value.trim(),
    password: pwd.value.trim(),
    walletAddress: WALLET,
    balance: 0,
    pendingRequest:false,
    createdAt: serverTimestamp()
  });
  renderApp();
};

/* ================= LOGIN ================= */
function renderLogin(){
  appDiv(`
    <div class="box">
      <h3>Enter Password</h3>
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <span class="link" onclick="forgotPassword()">Forgot Password?</span>
    </div>
  `);
}

window.login = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().password !== pwd.value.trim()) return alert("Wrong password");
  renderApp();
};

/* ================= FORGOT PASSWORD ================= */
window.forgotPassword = async ()=>{
  OTP_CODE = Math.floor(100000 + Math.random() * 900000).toString();
  await updateDoc(userRef,{ otp: OTP_CODE });
  tg.showPopup({ title:"StabiX OTP", message:"Your OTP: "+OTP_CODE, buttons:[{type:"ok"}] });
  renderOTP();
};

function renderOTP(){
  appDiv(`
    <div class="box">
      <h3>Verify OTP</h3>
      <input id="otp" placeholder="OTP">
      <input id="npwd" type="password" placeholder="New Password">
      <button onclick="verifyOTP()">Reset Password</button>
      <span class="link" onclick="forgotPassword()">Resend OTP</span>
    </div>
  `);
}

window.verifyOTP = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().otp !== otp.value.trim()) return alert("Invalid OTP");
  await updateDoc(userRef,{ password: npwd.value.trim(), otp:"" });
  renderLogin();
};

/* ================= MAIN APP ================= */
async function renderApp(){
  const user = (await getDoc(userRef)).data();
  const isValidator = (await getDoc(validatorRef)).exists();

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>
      <b>Balance:</b> ${user.balance.toFixed(2)} USDC

      <hr>
      <h3>Send USDC</h3>
      <input id="sendTo" placeholder="Receiver Wallet (TG_xxx)">
      <input id="sendAmt" type="number" placeholder="Amount">
      <button onclick="sendUSDC()">Send</button>

      <hr>
      <h3>Deposit / Withdraw</h3>
      <select id="type" onchange="toggleReqFields()">
        <option value="deposit">Deposit</option>
        <option value="withdraw">Withdraw</option>
      </select>

      <input id="amt" type="number" placeholder="Amount">
      <input id="waddr" placeholder="Wallet Address">
      <div id="txBox"><input id="txh" placeholder="Tx Hash (deposit)"></div>
      <button onclick="submitReq()">Submit</button>

      <hr>
      <h3>History</h3>
      <div id="history">Loading…</div>

      ${isValidator ? validatorPanel() : ""}
    </div>
  `);

  toggleReqFields();
  loadHistory();
}

/* ================= UI ================= */
window.toggleReqFields = ()=>{
  txBox.style.display = type.value === "deposit" ? "block" : "none";
};

/* ================= UTIL ================= */
function appDiv(h){ document.getElementById("app").innerHTML = h; }

init();
</script>
</body>
</html>
