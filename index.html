<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family: Arial;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:12px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:15px;
    }
    button {
      background:#2563eb;
      color:white;
      font-weight:bold;
    }
    hr {
      border:0;
      border-top:1px solid #1e293b;
      margin:15px 0;
    }
    .small { font-size:12px; opacity:0.7; }
    .tx { font-size:13px; margin-top:6px; }
  </style>
</head>

<body>
<div id="app"></div>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc,
  updateDoc, collection, addDoc,
  query, where, orderBy, getDocs
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBWWPgitPhLIYbR-ZmezpaP155cpn1_KPY",
  authDomain: "stabix-49cc6.firebaseapp.com",
  projectId: "stabix-49cc6",
  storageBucket: "stabix-49cc6.appspot.com",
  messagingSenderId: "68502925473",
  appId: "1:68502925473:web:86959dae39a377413800e0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= TELEGRAM ================= */
const tg = window.Telegram.WebApp;
tg.ready();

const ADMIN_TG_ID = "1303497305";

const tgUser = tg.initDataUnsafe.user;
const wallet = "TG_" + tgUser.id;

/* ================= INIT ================= */
const userRef = doc(db, "users", wallet);

async function init() {
  const snap = await getDoc(userRef);
  if (!snap.exists()) {
    renderRegister();
  } else {
    renderDashboard();
  }
}

/* ================= REGISTER ================= */
function renderRegister() {
  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>Create Username</h2>
      <input id="uname" placeholder="Choose username (one time)" />
      <button onclick="register()">Continue</button>
      <p class="small">Telegram ID = identity<br>Username sirf display ke liye</p>
    </div>
  `;
}

window.register = async function () {
  const uname = document.getElementById("uname").value.trim();
  if (!uname) return alert("Username required");

  await setDoc(userRef, {
    username: uname,
    balance: 0,
    createdAt: Date.now()
  });

  renderDashboard();
};

/* ================= DASHBOARD ================= */
async function renderDashboard() {
  const snap = await getDoc(userRef);
  const user = snap.data();
  const isAdmin = String(tgUser.id) === ADMIN_TG_ID;

  const txQuery = query(
    collection(db, "transactions"),
    where("participants", "array-contains", wallet),
    orderBy("timestamp", "desc")
  );

  const txSnap = await getDocs(txQuery);
  let history = "";
  txSnap.forEach(d => {
    const t = d.data();
    history += `
      <div class="tx">
        ${t.from} → ${t.to} : ${t.amount} USDC<br>
        <span class="small">${new Date(t.timestamp).toLocaleString()}</span>
      </div>
    `;
  });

  if (!history) history = `<p class="small">No transactions yet</p>`;

  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${wallet}</p>

      <hr>
      <h3>Balance</h3>
      <b>${user.balance.toFixed(2)} USDC</b>

      <hr>
      <h3>Send</h3>
      <input id="to" placeholder="Receiver Wallet (TG_...)" />
      <input id="amt" type="number" placeholder="Amount" />
      <button onclick="send()">Send</button>

      <hr>
      <h3>History</h3>
      ${history}

      ${isAdmin ? adminPanel() : ""}
    </div>
  `;
}

function adminPanel() {
  return `
    <hr>
    <h3>System Panel</h3>
    <input id="aw" placeholder="User Wallet" />
    <input id="aa" type="number" placeholder="Amount" />
    <button onclick="addBalance()">Add Balance</button>
  `;
}

/* ================= ACTIONS ================= */
window.send = async function () {
  const to = document.getElementById("to").value.trim();
  const amt = Number(document.getElementById("amt").value);

  if (!to || amt <= 0) return alert("Invalid input");

  const fromSnap = await getDoc(userRef);
  if (fromSnap.data().balance < amt) return alert("Insufficient balance");

  const toRef = doc(db, "users", to);
  const toSnap = await getDoc(toRef);
  if (!toSnap.exists()) return alert("User not found");

  await updateDoc(userRef, { balance: fromSnap.data().balance - amt });
  await updateDoc(toRef, { balance: toSnap.data().balance + amt });

  await addDoc(collection(db, "transactions"), {
    from: wallet,
    to,
    amount: amt,
    participants: [wallet, to],
    timestamp: Date.now()
  });

  renderDashboard();
};

window.addBalance = async function () {
  const w = document.getElementById("aw").value.trim();
  const a = Number(document.getElementById("aa").value);
  if (!w || a <= 0) return alert("Invalid");

  const ref = doc(db, "users", w);
  const snap = await getDoc(ref);
  if (!snap.exists()) return alert("User not found");

  await updateDoc(ref, { balance: snap.data().balance + a });

  await addDoc(collection(db, "transactions"), {
    from: "SYSTEM",
    to: w,
    amount: a,
    participants: [w],
    timestamp: Date.now()
  });

  renderDashboard();
};

init();
</script>
</body>
</html>
