<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
    .warn { color:#facc15; font-size:13px; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp,
  query, where, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1",
};
const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);

/* ================= TELEGRAM ================= */
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const tgUser = tg.initDataUnsafe?.user;
if(!tgUser?.id){
  document.getElementById("app").innerHTML="Telegram user not found";
  throw "";
}

/* ================= IDENTITY ================= */
const WALLET = "TG_" + tgUser.id;
const userRef = doc(db,"users",WALLET);
const validatorRef = doc(db,"validators",String(tgUser.id));

/* ================= INIT ================= */
async function init(){
  try{
    const snap = await getDoc(userRef);
    if(!snap.exists() || !snap.data()?.password){
      renderSetup(); 
      return;
    }
    renderLogin();
  }catch(e){
    document.getElementById("app").innerHTML="Init error";
    console.error(e);
  }
}

/* ================= SETUP ================= */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Account</h3>
      <input id="uname" placeholder="Username">
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="saveProfile()">Create</button>
    </div>
  `);
}

window.saveProfile = async ()=>{
  if(!uname.value.trim() || !pwd.value.trim()) return alert("Fill all fields");
  await setDoc(userRef,{
    username: uname.value.trim(),
    password: pwd.value.trim(),
    walletAddress: WALLET,
    balance: 0,
    pendingRequest:false,
    isFrozen:false,
    createdAt: serverTimestamp()
  });
  renderApp();
};

/* ================= LOGIN ================= */
function renderLogin(){
  appDiv(`
    <div class="box">
      <h3>Login</h3>
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
    </div>
  `);
}

window.login = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().password !== pwd.value.trim()) return alert("Wrong password");
  renderApp();
};

/* ================= MAIN APP ================= */
async function renderApp(){
  const userSnap = await getDoc(userRef);
  const user = userSnap.data();
  const isValidator = (await getDoc(validatorRef)).exists();

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>

      <hr>
      <b>Balance:</b> ${user.balance} USDC
      ${user.isFrozen ? `<div class="warn">Account frozen (request under review)</div>` : ""}

      <hr>
      <h3>Send USDC</h3>
      <input id="sendTo" placeholder="Receiver Wallet">
      <input id="sendAmt" type="number" placeholder="Amount">
      <button onclick="sendUSDC()">Send</button>

      <hr>
      <h3>Deposit / Withdraw</h3>
      <select id="dwType">
        <option value="deposit">Deposit</option>
        <option value="withdraw">Withdraw</option>
      </select>
      <input id="dwAmount" type="number" placeholder="Amount">
      <input id="dwWallet" placeholder="Wallet Address">
      <input id="dwTxHash" placeholder="Tx Hash (deposit only)">
      <button onclick="submitDW()">Submit</button>

      ${isValidator ? validatorPanel() : ""}
    </div>
  `);

  if(isValidator){
    setTimeout(loadRequests, 300);
  }
}

/* ================= SEND USDC ================= */
window.sendUSDC = async ()=>{
  try{
    await runTransaction(db, async(tx)=>{
      const fromSnap = await tx.get(userRef);
      if(fromSnap.data().isFrozen === true){
        throw "Account frozen";
      }
      const toWallet = sendTo.value.trim();
      const amount = Number(sendAmt.value);
      if(!toWallet || amount<=0) throw "Invalid input";

      const toRef = doc(db,"users",toWallet);
      const toSnap = await tx.get(toRef);
      if(!toSnap.exists()) throw "Receiver not found";
      if(fromSnap.data().balance < amount) throw "Insufficient balance";

      tx.update(userRef,{ balance: fromSnap.data().balance - amount });
      tx.update(toRef,{ balance: toSnap.data().balance + amount });
    });
    renderApp();
  }catch(e){ alert(e); }
};

/* ================= DEPOSIT / WITHDRAW REQUEST ================= */
window.submitDW = async ()=>{
  const snap = await getDoc(userRef);
  const user = snap.data();

  if(user.pendingRequest === true){
    return alert("Request already under review");
  }

  const type = dwType.value;
  const amount = Number(dwAmount.value);
  const wallet = dwWallet.value.trim();
  const txHash = dwTxHash.value.trim();

  if(amount<=0 || !wallet) return alert("Invalid input");
  if(type==="withdraw" && amount > user.balance) return alert("Insufficient balance");
  if(type==="deposit" && !txHash) return alert("Tx hash required");

  await addDoc(collection(db,"requests"),{
    userId: WALLET,
    type,
    amount,
    walletAddress: wallet,
    txHash: type==="deposit" ? txHash : "",
    status:"pending",
    createdAt: serverTimestamp()
  });

  await updateDoc(userRef,{ pendingRequest:true, isFrozen:true });
  alert("Request submitted");
  renderApp();
};

/* ================= VALIDATOR PANEL ================= */
function validatorPanel(){
  return `
    <hr>
    <h3>Validator Panel</h3>
    <button onclick="loadRequests()">Load Pending</button>
    <div id="vout"></div>
  `;
}

/* ================= LOAD REQUESTS ================= */
window.loadRequests = async ()=>{
  const q = query(collection(db,"requests"), where("status","==","pending"));
  const snap = await getDocs(q);
  let html = "";

  snap.forEach(d=>{
    const r = d.data();
    html += `
      <div class="tx">
        <b>${r.type.toUpperCase()}</b><br>
        ${r.userId}<br>
        Amount: ${r.amount}<br>
        Wallet: ${r.walletAddress}<br>
        ${r.txHash ? "TxHash: "+r.txHash+"<br>" : ""}
        <button onclick="approveReq('${d.id}')">Approve</button>
        <button onclick="rejectReq('${d.id}')">Reject</button>
      </div>
    `;
  });

  document.getElementById("vout").innerHTML =
    html || "<span class='small'>No pending requests</span>";
};

/* ================= APPROVE ================= */
window.approveReq = async (id)=>{
  await runTransaction(db, async(tx)=>{
    const rRef = doc(db,"requests",id);
    const rSnap = await tx.get(rRef);
    const r = rSnap.data();

    const uRef = doc(db,"users",r.userId);
    const uSnap = await tx.get(uRef);

    let bal = uSnap.data().balance;
    if(r.type==="deposit") bal += r.amount;
    else{
      if(bal < r.amount) throw "Insufficient balance";
      bal -= r.amount;
    }

    tx.update(uRef,{ balance:bal, pendingRequest:false, isFrozen:false });
    tx.update(rRef,{ status:"approved" });
  });
  loadRequests();
};

/* ================= REJECT ================= */
window.rejectReq = async (id)=>{
  const rRef = doc(db,"requests",id);
  const rSnap = await getDoc(rRef);
  await updateDoc(doc(db,"users",rSnap.data().userId),{
    pendingRequest:false,
    isFrozen:false
  });
  await updateDoc(rRef,{ status:"rejected" });
  loadRequests();
};

/* ================= UTIL ================= */
function appDiv(h){ document.getElementById("app").innerHTML = h; }

init();
</script>
</body>
</html>
