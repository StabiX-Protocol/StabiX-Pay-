<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
    .warn { color:#facc15; font-size:13px; }
    /* ===== GPay Style Transaction Popup ===== */
.tx-popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.tx-card {
  background:#020617;
  border-radius:18px;
  padding:30px 25px;
  text-align:center;
  width:320px;
  max-width:90%;
  animation: scaleIn .25s ease;
}
.spinner {
  width:60px;
  height:60px;
  border:5px solid #1e293b;
  border-top:5px solid #22c55e;
  border-radius:50%;
  margin:0 auto 15px;
  animation: spin 1s linear infinite;
}

.check {
  font-size:42px;
  color:#22c55e;
  display:none;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

@keyframes scaleIn {
  from { transform: scale(.8); opacity:0 }
  to { transform: scale(1); opacity:1 }
}
  </style>
</head>

<body>
<div id="app">Loading…</div>
<!-- ===== Transaction Popup ===== -->
<div id="txPopup" class="tx-popup">
  <div class="tx-card">
    <audio id="txSound" preload="auto">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3" type="audio/mpeg">
    </audio>
    <div id="txSpinner" class="spinner"></div>
    <div id="txCheck" class="check">✅</div>

    <div id="txMsg" style="margin-top:10px;font-size:16px;"></div>
    <div id="txTime" class="small" style="margin-top:6px;"></div>

    <button id="txDoneBtn"
      style="margin-top:16px;background:#22c55e;color:#022c22;font-weight:bold;display:none"
      onclick="closeTxPopup()">
      DONE
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp,
  query, where, orderBy, runTransaction,
  Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1",
  storageBucket: "stabix-backend-v1.firebasestorage.app",
  messagingSenderId: "351361221507",
  appId: "1:351361221507:web:ebaf0d15e86d4b184c6cb6"
};
const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);

/* ================= TELEGRAM ================= */
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const tgUser = tg.initDataUnsafe?.user;
if(!tgUser?.id){ document.getElementById("app").innerHTML="Telegram user not found"; throw ""; }

/* ================= IDENTITY ================= */
const WALLET = "TG_" + tgUser.id;
const userRef = doc(db,"users",WALLET);
const validatorRef = doc(db,"validators",String(tgUser.id));

/* ================= INIT ================= */
async function init(){
  const snap = await getDoc(userRef);
  if(!snap.exists() || !snap.data()?.password){
    renderSetup(); return;
  }
  renderLogin();
}

/* ================= SETUP ================= */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Account</h3>
      <input id="uname" placeholder="Username">
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="saveProfile()">Create</button>
    </div>
  `);
}

window.saveProfile = async ()=>{
  if(!uname.value.trim() || !pwd.value.trim()) return alert("Fill all fields");
  await setDoc(userRef,{
    username: uname.value.trim(),
    password: pwd.value.trim(),
    walletAddress: WALLET,
    balance: 0,
    pendingRequest:false,
    lastUsernameChange: serverTimestamp(),
    createdAt: serverTimestamp()
  });
  renderApp();
};

/* ================= LOGIN ================= */
function renderLogin(){
  appDiv(`
    <div class="box">
      <h3>Login</h3>
      <input id="pwd" type="password" placeholder="Password">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <button style="width:70%" onclick="login()">Login</button>
        <span style="font-size:12px;color:#60a5fa;cursor:pointer" onclick="forgotPassword()">Forgot?</span>
      </div>
    </div>
  `);
}

window.login = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().password !== pwd.value.trim()) return alert("Wrong password");
  renderApp();
};

/* ================= FORGOT PASSWORD ================= */
window.forgotPassword = async ()=>{
  const otp = Math.floor(100000 + Math.random()*900000).toString();
  await updateDoc(userRef,{ otp });
  tg.showPopup({ title:"OTP", message:"Your OTP: "+otp, buttons:[{type:"ok"}] });
  renderOTP();
};

function renderOTP(){
  appDiv(`
    <div class="box">
      <h3>Reset Password</h3>
      <input id="otp" placeholder="OTP">
      <input id="npwd" type="password" placeholder="New Password">
      <button onclick="verifyOTP()">Reset</button>
      <span style="font-size:12px;color:#60a5fa;cursor:pointer" onclick="forgotPassword()">Resend</span>
    </div>
  `);
}

window.verifyOTP = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().otp !== otp.value.trim()) return alert("Invalid OTP");
  await updateDoc(userRef,{ password: npwd.value.trim(), otp:"" });
  renderLogin();
};

/* ================= USERNAME CHANGE (30 DAYS) ================= */
window.changeUsername = async ()=>{
  const snap = await getDoc(userRef);
  const last = snap.data().lastUsernameChange?.toDate();
  if(last && ((Date.now()-last)/(1000*60*60*24)) < 30)
    return alert("Username can be changed once every 30 days");

  const name = prompt("New username");
  if(!name?.trim()) return;
  await updateDoc(userRef,{ username:name.trim(), lastUsernameChange:serverTimestamp() });
  renderApp();
};

/* ================= MAIN APP ================= */
async function renderApp(){
  const user = (await getDoc(userRef)).data();
  const isValidator = (await getDoc(validatorRef)).exists();
  const now = new Date();
const yyyy = now.getFullYear();
const mm = String(now.getMonth() + 1).padStart(2,"0");
const dd = String(now.getDate()).padStart(2,"0");
const today = `${yyyy}-${mm}-${dd}`;
  appDiv(`
    <div class="box">
  <h2 style="margin:0">${user.username}</h2>
  <span 
    onclick="changeUsername()" 
    style="font-size:16px;cursor:pointer;opacity:0.7"
    title="Change username" >✏️</span>
      <p class="small">${WALLET}</p>
      

      <hr>
      <b>Balance:</b> ${user.balance.toFixed(2)} USDC
      ${user.pendingRequest
  ? `<div class="warn"> Pending request under review</div>`
  : ""
      }

      <hr>
      <h3>Send USDC</h3>
      <input id="sendTo" placeholder="Receiver Wallet (TG_xxx)">
      <input id="sendAmt" type="number" placeholder="Amount">
      <button onclick="sendUSDC()">Send</button>
      <hr>
       <hr>
<h3>Deposit / Withdraw</h3>

<select id="dwType" onchange="toggleDW()">
  <option value="deposit">Deposit</option>
  <option value="withdraw">Withdraw</option>
</select>

<input id="dwAmount" type="number" placeholder="Amount">
<input id="dwWallet" placeholder="Wallet Address">

<div id="txHashBox">
  <input id="dwTxHash" placeholder="Transaction Hash (Deposit only)">
</div>

<button onclick="submitDW()">Submit</button>


      <hr>
      <h3>Transaction History</h3>

<input
  id="historyDate"
  type="date"
  value="${today}"
  max="${today}"
  onchange="loadHistoryByDate()"
/>

<div id="history">Loading...</div>

      ${isValidator ? validatorPanel() : ""}
    </div>
  `);

  loadHistory();
  // 🎉 RECEIVE POPUP (one-time)
try{
  const q = query(
    collection(db,"transactions"),
    where("userId","==",WALLET),
    orderBy("createdAt","desc")
  );

  const snap = await getDocs(q);
  if(!snap.empty){
    const docSnap = snap.docs[0];
    const t = docSnap.data();

    // sirf received ke liye
    if(t.type === "received"){
      const key = "rx_" + docSnap.id;

      // ek hi baar popup
      if(!sessionStorage.getItem(key)){
        showTxPopup(`Received ${t.amount} USDC from ${t.counterparty}`);
        sessionStorage.setItem(key,"1");
      }
    }
  }
}catch(e){
  console.log("Receive popup error", e);
}
}

/* ================= SEND USDC ================= */
window.sendUSDC = async ()=>{
  const snap = await getDoc(userRef);
if(snap.data().pendingRequest){
  alert("Account frozen. Wait for validator approval.");
  return;
}
  const toWallet = sendTo.value.trim();
  const amount = Number(sendAmt.value);
  if(!toWallet || amount<=0) return alert("Invalid input");
  if(toWallet === WALLET){
    tg.showPopup({ title:"Blocked", message:"Cannot send to yourself", buttons:[{type:"ok"}] });
    return;
  }

  try{
    await runTransaction(db, async(tx)=>{
      const fromSnap = await tx.get(userRef);
      const toRef = doc(db,"users",toWallet);
      const toSnap = await tx.get(toRef);
      if(!toSnap.exists()) throw "Receiver not found";
      if(fromSnap.data().balance < amount) throw "Insufficient balance";

      tx.update(userRef,{ balance: fromSnap.data().balance - amount });
      tx.update(toRef,{ balance: toSnap.data().balance + amount });

      tx.set(doc(collection(db,"transactions")),{
        userId: WALLET, type:"sent", amount, counterparty:toWallet, createdAt:serverTimestamp()
      });
      tx.set(doc(collection(db,"transactions")),{
        userId: toWallet, type:"received", amount, counterparty:WALLET, createdAt:serverTimestamp()
      });
    });
    showTxPopup(`Sent ${amount} USDC to ${toWallet}`);
    renderApp();
  }catch(e){ alert(e); }
};
  /*===============Deposit & Withdraw Logic======*/
  window.toggleDW = ()=>{
  const type = document.getElementById("dwType").value;
  document.getElementById("txHashBox").style.display =
    type === "deposit" ? "block" : "none";
};

window.submitDW = async ()=>{
  const type = dwType.value;
  const amount = Number(dwAmount.value);
  const wallet = dwWallet.value.trim();
  const txHash = dwTxHash?.value || "";

  if(!amount || amount<=0 || !wallet)
    return alert("Invalid input");

  const snap = await getDoc(userRef);

  // 🔒 already frozen
  if(snap.data().pendingRequest){
    alert("Your account is frozen. Pending request under review.");
    return;
  }

  // ❌ withdraw > balance
  if(type==="withdraw" && amount > snap.data().balance){
    alert("Insufficient balance");
    return;
  }

  if(type==="deposit" && !txHash)
    return alert("Transaction hash required for deposit");

  await addDoc(collection(db,"requests"),{
    userId: WALLET,
    type,
    amount,
    walletAddress: wallet,
    txHash: type==="deposit" ? txHash : "",
    status:"pending",
    createdAt: serverTimestamp()
  });

  // 🔒 FREEZE ACCOUNT
  await updateDoc(userRef,{ pendingRequest:true });

  alert(type.toUpperCase()+" request submitted. Account frozen.");
  renderApp();
};
  
/* ================= HISTORY ================= */
/* ================= HISTORY ================= */

async function loadHistory() {
  const q = query(
    collection(db, "transactions"),
    where("userId", "==", WALLET)
  );

  const snap = await getDocs(q);
  renderHistoryFromSnap(snap, "No transactions");
}

window.loadHistoryByDate = async () => {
  const selected = document.getElementById("historyDate")?.value;

  if (!selected) {
    loadHistory(); // fallback
    return;
  }

  const startDate = new Date(selected);
startDate.setHours(0, 0, 0, 0);

const endDate = new Date(selected);
endDate.setHours(23, 59, 59, 999);

const start = Timestamp.fromDate(startDate);
const end = Timestamp.fromDate(endDate);
  const q = query(
    collection(db, "transactions"),
    where("userId", "==", WALLET),
    where("createdAt", ">=", start),
    where("createdAt", "<=", end)
  );

  const snap = await getDocs(q);
  renderHistoryFromSnap(snap, "No transactions for this date");
};

/* ================= HISTORY RENDER ================= */

function renderHistoryFromSnap(snap, emptyText) {
  let html = "";

  snap.forEach(d => {
    const t = d.data();

    const isDepositWithdraw =
      t.type === "deposit" || t.type === "withdraw";

    const isCredit = isDepositWithdraw
      ? t.type === "deposit"
      : t.type === "received";

    const sign = isCredit ? "+" : "-";
    const color = isCredit ? "#22c55e" : "#ef4444";

    const metaLine = isDepositWithdraw
      ? t.type.toUpperCase()
      : (isCredit
          ? `${t.counterparty} → ${WALLET}`
          : `${WALLET} → ${t.counterparty}`);

    html += `
      <div class="tx" style="color:${color}">
        <b>${sign}${t.amount} USDC</b><br>
        <span class="small">
          ${metaLine}<br>
          ${t.createdAt?.toDate()?.toLocaleString() || ""}
        </span>
      </div>
    `;
  });

  document.getElementById("history").innerHTML =
    html || `<span class="small">${emptyText}</span>`;
}
  
/* ================= VALIDATOR PANEL ================= */
function validatorPanel(){
  return `
    <hr>
    <h3>Validator Panel</h3>

    <input id="vUser" placeholder="Target User ID (TG_xxx)">
    <select id="vType">
      <option value="deposit">Deposit</option>
      <option value="withdraw">Withdraw</option>
    </select>
    <input id="vAmount" type="number" placeholder="Amount">
    <button onclick="checkUserBalance()">Check Balance</button>
<div id="balanceOut" class="small" style="margin-top:8px"></div>

    <button onclick="validatorAdjust()">Apply</button>

    <hr>
    <button onclick="loadRequests()">Load Pending</button>
    <div id="vout"></div>
  `;
}
window.validatorAdjust = async ()=>{
  try{
    const uid = document.getElementById("vUser").value.trim();
    const type = document.getElementById("vType").value;
    const amount = Number(document.getElementById("vAmount").value);

    if(!uid || amount <= 0){
      alert("Invalid input");
      return;
    }

    const targetRef = doc(db,"users",uid);

    await runTransaction(db, async(tx)=>{
      const snap = await tx.get(targetRef);
      if(!snap.exists()) throw "User not found";

      let bal = snap.data().balance;

      if(type === "deposit"){
        bal += amount;
      }else{
        bal -= amount;
      }

      if(bal < 0) throw "Insufficient balance";

      tx.update(targetRef,{ balance: bal });

      tx.set(doc(collection(db,"transactions")),{
        userId: uid,
        type: type,              // deposit / withdraw
        amount: amount,
        counterparty: "VALIDATOR",
        createdAt: serverTimestamp()
      });
    });

    alert("Balance updated successfully");
  }catch(e){
    alert("Validator error: " + e);
  }
};
  window.loadRequests = async ()=>{
  const q = query(
    collection(db,"requests"),
    where("status","==","pending")
  );

  const snap = await getDocs(q);
  let html = "";

  snap.forEach(d=>{
    const r = d.data();

    const time = r.createdAt
      ? r.createdAt.toDate().toLocaleString()
      : "";

    html += `
      <div class="tx">
        <b>${r.type.toUpperCase()} ${r.amount} USDC</b><br>

        <span class="small">
          User ID: ${r.userId}<br>
          Wallet: ${r.walletAddress}<br>
          ${r.txHash ? `Tx Hash: ${r.txHash}<br>` : ""}
          Time: ${time}
        </span>

        <br><br>
        <button onclick="approveReq('${d.id}')">Approve</button>
        <button onclick="rejectReq('${d.id}')">Reject</button>
      </div>
    `;
  });

  document.getElementById("vout").innerHTML =
    html || "<span class='small'>No pending requests</span>";
};
  
window.approveReq = async (reqId)=>{
  const reqRef = doc(db,"requests",reqId);

  await runTransaction(db, async(tx)=>{
    const reqSnap = await tx.get(reqRef);
    if(!reqSnap.exists()) throw "Request not found";

    const r = reqSnap.data();
    const userRefX = doc(db,"users", r.userId);
    const userSnap = await tx.get(userRefX);

    let bal = userSnap.data().balance;

    if(r.type === "deposit"){
      bal += r.amount;
    }

    if(r.type === "withdraw"){
      if(bal < r.amount) throw "Insufficient balance";
      bal -= r.amount;
    }

    // 🔓 UNFREEZE USER + UPDATE BALANCE
    tx.update(userRefX,{
      balance: bal,
      pendingRequest: false
    });

    // ✅ MARK REQUEST APPROVED
    tx.update(reqRef,{
      status: "approved"
    });

    // 🧾 TRANSACTION ENTRY
    tx.set(doc(collection(db,"transactions")),{
      userId: r.userId,
      type: r.type,
      amount: r.amount,
      counterparty: "VALIDATOR",
      createdAt: serverTimestamp()
    });
  });

  alert("Request approved");
  loadRequests();
};
  window.rejectReq = async (reqId)=>{
  const reqRef = doc(db,"requests",reqId);
  const snap = await getDoc(reqRef);

  await updateDoc(doc(db,"users", snap.data().userId),{
    pendingRequest:false   // 🔓 UNFREEZE
  });

  await updateDoc(reqRef,{ status:"rejected" });

  alert("Rejected");
  loadRequests();
};
  window.checkUserBalance = async ()=>{
  const uid = document.getElementById("vUser").value.trim();
  const out = document.getElementById("balanceOut");

  if(!uid){
    out.innerText = "Enter User ID";
    return;
  }

  try{
    const snap = await getDoc(doc(db,"users",uid));
    if(!snap.exists()){
      out.innerText = "User not found";
      return;
    }

    out.innerText =
      `Balance: ${snap.data().balance.toFixed(2)} USDC`;
  }catch(e){
    out.innerText = "Error fetching balance";
  }
};
  function showTxPopup(msg){
  const pop = document.getElementById("txPopup");
  const spin = document.getElementById("txSpinner");
  const check = document.getElementById("txCheck");
  const txt = document.getElementById("txMsg");
  const time = document.getElementById("txTime");
  const doneBtn = document.getElementById("txDoneBtn");

  // message + time
  txt.innerText = msg;
  time.innerText = new Date().toLocaleString();

  // ✅ FINAL STATE (NO TIMER)
  spin.style.display = "none";      // ❌ spinner band
  check.style.display = "block";    // ✅ success
  doneBtn.style.display = "block";  // ✅ DONE button
  pop.style.display = "flex";
  }

  window.closeTxPopup = function (){
  const pop = document.getElementById("txPopup");
  if(pop) pop.style.display = "none";
};
  // ✅ DONE button handler (module-safe)
const doneBtnEl = document.getElementById("txDoneBtn");
if (doneBtnEl) {
  doneBtnEl.addEventListener("click", () => {
    const pop = document.getElementById("txPopup");
    if (pop) pop.style.display = "none";
  });
}
    
/* ================= UTIL ================= */
function appDiv(h){ document.getElementById("app").innerHTML = h; }

init();
</script>
</body>
</html>
