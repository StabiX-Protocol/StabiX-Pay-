<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family: Arial;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:12px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:15px;
    }
    button {
      background:#2563eb;
      color:white;
      font-weight:bold;
    }
    hr {
      border:0;
      border-top:1px solid #1e293b;
      margin:15px 0;
    }
    .small {
      font-size:12px;
      opacity:0.7;
    }
    .tx {
      font-size:13px;
      margin-top:6px;
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
/* ================= CONFIG ================= */
const ADMIN_WALLET = "0x6b7caa5b11106dfac2a415fd98e01e38c42f0e8d".toLowerCase();

/* ================= STORAGE ================= */
let users = JSON.parse(localStorage.getItem("stabix_users") || "{}");
let txs   = JSON.parse(localStorage.getItem("stabix_txs") || []);

const wallet = localStorage.getItem("stabix_wallet");
const username = localStorage.getItem("stabix_username");

/* ================= INIT ================= */
if (!wallet || !username) {
  renderRegister();
} else {
  if (!users[wallet]) {
    users[wallet] = { username, balance: 0 };
    save();
  }
  renderDashboard();
}

/* ================= UI ================= */
function renderRegister() {
  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>Create Account</h2>
      <input id="w" placeholder="Wallet Address" />
      <input id="u" placeholder="Username (one-time)" />
      <button onclick="register()">Continue</button>
      <p class="small">Username sirf identification ke liye hai</p>
    </div>
  `;
}

function renderDashboard() {
  const user = users[wallet];
  const history = txs
    .filter(t => t.from === wallet || t.to === wallet)
    .slice(-5).reverse()
    .map(t => `
      <div class="tx">
        ${users[t.from]?.username || t.from.slice(0,6)} →
        ${users[t.to]?.username || t.to.slice(0,6)}
        : ${t.amount} USDC
      </div>
    `).join("") || `<p class="small">No activity yet</p>`;

  const isAdmin = wallet.toLowerCase() === ADMIN_WALLET;

  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${wallet}</p>

      <hr>
      <h3>Balance</h3>
      <b>${user.balance.toFixed(2)} USDC</b>

      <hr>
      <h3>Send USDC</h3>
      <input id="toWallet" placeholder="Receiver Wallet Address" />
      <input id="amt" type="number" placeholder="Amount" />
      <button onclick="send()">Send</button>

      <hr>
      <h3>Activity</h3>
      ${history}

      ${isAdmin ? adminPanel() : ""}

      <hr>
      <button onclick="logout()">Logout</button>
    </div>
  `;
}

function adminPanel() {
  return `
    <hr>
    <h3>System Panel</h3>
    <input id="aw" placeholder="User Wallet" />
    <input id="aa" type="number" placeholder="Amount" />
    <button onclick="addBalance()">Add Balance</button>
  `;
}

/* ================= ACTIONS ================= */
function register() {
  const w = document.getElementById("w").value.trim();
  const u = document.getElementById("u").value.trim();
  if (!w || !u) return alert("Fill all fields");
  localStorage.setItem("stabix_wallet", w);
  localStorage.setItem("stabix_username", u);
  location.reload();
}

function send() {
  const to = document.getElementById("toWallet").value.trim();
  const amt = parseFloat(document.getElementById("amt").value);
  if (!users[to]) return alert("Wallet not registered");
  if (amt <= 0) return alert("Invalid amount");
  if (users[wallet].balance < amt) return alert("Insufficient balance");

  users[wallet].balance -= amt;
  users[to].balance += amt;

  txs.push({ from: wallet, to, amount: amt });
  save();
  renderDashboard();
}

function addBalance() {
  const w = document.getElementById("aw").value.trim();
  const a = parseFloat(document.getElementById("aa").value);
  if (!users[w]) return alert("Wallet not found");
  users[w].balance += a;
  txs.push({ from: "SYSTEM", to: w, amount: a });
  save();
  renderDashboard();
}

function logout() {
  localStorage.clear();
  location.reload();
}

function save() {
  localStorage.setItem("stabix_users", JSON.stringify(users));
  localStorage.setItem("stabix_txs", JSON.stringify(txs));
}
</script>
</body>
</html>
