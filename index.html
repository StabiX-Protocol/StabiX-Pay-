<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; font-size:15px; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    button:disabled { background:#334155; cursor:not-allowed; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; margin-top:8px; padding-bottom:8px; border-bottom:1px dashed #1e293b; }
    .warn { color:#facc15; font-size:13px; margin-top:10px; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  arrayUnion, collection, addDoc, getDocs
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* ---------- FIREBASE ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyBWWPgitPhLIYbR-ZmezpaP155cpn1_KPY",
  authDomain: "stabix-49cc6.firebaseapp.com",
  projectId: "stabix-49cc6"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* ---------- DEVICE & WALLET ---------- */
function getDeviceId(){
  let id = localStorage.getItem("device_id");
  if(!id){
    id = "DEV_" + crypto.randomUUID();
    localStorage.setItem("device_id", id);
  }
  return id;
}

function getWallet(){
  let w = localStorage.getItem("wallet_id");
  if(!w){
    w = "WALLET_" + crypto.randomUUID();
    localStorage.setItem("wallet_id", w);
  }
  return w;
}

const deviceId = getDeviceId();
const wallet   = getWallet();
const userRef  = doc(db,"users",wallet);
const requestsRef = collection(db,"requests");

/* ---------- INIT ---------- */
async function init(){
  const snap = await getDoc(userRef);
  if(!snap.exists()){
    appDiv(`
      <div class="box">
        <h3>Create Username</h3>
        <input id="uname" placeholder="Username" />
        <button onclick="saveUsername()">Continue</button>
      </div>
    `);
    return;
  }
  render();
}

window.saveUsername = async ()=>{
  const u = uname.value.trim();
  if(!u) return alert("Enter username");

  await setDoc(userRef,{
    username:u,
    wallet,
    balance:0,
    history:[],
    pendingRequest:false,
    role:"user"     /* change to 'validator' manually in Firebase for YOU */
  });
  render();
};

/* ---------- RENDER ---------- */
async function render(){
  const snap = await getDoc(userRef);
  const user = snap.data();

  const isValidator =
    user.role === "validator" &&
    user.validatorDeviceId === deviceId;

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${wallet}</p>

      <hr><h3>Balance</h3>
      <b>${user.balance.toFixed(2)} USDC</b>

      ${isValidator ? validatorPanel() : ""}
    </div>
  `);
}

/* ---------- VALIDATOR PANEL ---------- */
function validatorPanel(){
  return `
    <hr><h3>Validator Panel</h3>
    <input id="vUser" placeholder="User Wallet">
    <input id="vAmt" type="number" placeholder="Amount">
    <button onclick="validatorDeposit()">Deposit</button>
    <button onclick="validatorWithdraw()">Withdraw</button>
  `;
}

window.validatorDeposit = async ()=>{
  const w = vUser.value.trim();
  const amt = Number(vAmt.value);
  if(!w || !amt) return alert("Fill all");

  const ref = doc(db,"users",w);
  const snap = await getDoc(ref);
  if(!snap.exists()) return alert("User not found");

  await updateDoc(ref,{
    balance: snap.data().balance + amt,
    history: arrayUnion({
      type:"Deposit",
      amount:amt,
      from:"VALIDATOR",
      to:w,
      time:Date.now()
    })
  });
};

window.validatorWithdraw = async ()=>{
  const w = vUser.value.trim();
  const amt = Number(vAmt.value);
  if(!w || !amt) return alert("Fill all");

  const ref = doc(db,"users",w);
  const snap = await getDoc(ref);
  if(!snap.exists()) return alert("User not found");
  if(amt > snap.data().balance) return alert("Insufficient balance");

  await updateDoc(ref,{
    balance: snap.data().balance - amt,
    history: arrayUnion({
      type:"Withdraw",
      amount:amt,
      from:w,
      to:"VALIDATOR",
      time:Date.now()
    })
  });
};

function appDiv(h){ document.getElementById("app").innerHTML=h; }
init();
</script>
</body>
</html>
