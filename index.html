<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- TELEGRAM MINI APP SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family: Arial;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:12px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:15px;
    }
    button {
      background:#2563eb;
      color:white;
      font-weight:bold;
    }
    hr {
      border:0;
      border-top:1px solid #1e293b;
      margin:15px 0;
    }
    .small {
      font-size:12px;
      opacity:0.7;
    }
    .tx {
      font-size:13px;
      margin-top:6px;
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
/* ================= TELEGRAM INIT ================= */
const tg = window.Telegram?.WebApp;
tg?.ready();

/* ================= CONFIG ================= */
const ADMIN_TG_ID = "123456789"; // <- apna Telegram numeric ID daal
const ADMIN_WALLET = "ADMIN";

/* ================= USER FROM TELEGRAM ================= */
let tgUser = tg?.initDataUnsafe?.user || null;

// Fallback for browser testing
if (!tgUser) {
  tgUser = {
    id: "browser_user",
    username: "BrowserUser",
    first_name: "Browser"
  };
}

const wallet = "TG_" + tgUser.id;
const username = tgUser.username || tgUser.first_name || "User";

/* ================= STORAGE ================= */
let users = JSON.parse(localStorage.getItem("stabix_users") || "{}");
let txs   = JSON.parse(localStorage.getItem("stabix_txs") || []);

/* ================= INIT ================= */
if (!users[wallet]) {
  users[wallet] = { username, balance: 0 };
  save();
}
renderDashboard();

/* ================= UI ================= */
function renderDashboard() {
  const user = users[wallet];

  const history = txs
    .filter(t => t.from === wallet || t.to === wallet)
    .slice(-5).reverse()
    .map(t => `
      <div class="tx">
        ${t.from} → ${t.to} : ${t.amount} USDC
      </div>
    `).join("") || `<p class="small">No activity yet</p>`;

  const isAdmin = String(tgUser.id) === ADMIN_TG_ID;

  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${wallet}</p>

      <hr>
      <h3>Balance</h3>
      <b>${user.balance.toFixed(2)} USDC</b>

      <hr>
      <h3>Send USDC</h3>
      <input id="toWallet" placeholder="Receiver Wallet (TG_123)" />
      <input id="amt" type="number" placeholder="Amount" />
      <button onclick="send()">Send</button>

      <hr>
      <h3>Activity</h3>
      ${history}

      ${isAdmin ? adminPanel() : ""}

    </div>
  `;
}

function adminPanel() {
  return `
    <hr>
    <h3>System Panel</h3>
    <input id="aw" placeholder="User Wallet" />
    <input id="aa" type="number" placeholder="Amount" />
    <button onclick="addBalance()">Add Balance</button>
  `;
}

/* ================= ACTIONS ================= */
function send() {
  const to = document.getElementById("toWallet").value.trim();
  const amt = parseFloat(document.getElementById("amt").value);

  if (!users[to]) return alert("Wallet not registered");
  if (amt <= 0) return alert("Invalid amount");
  if (users[wallet].balance < amt) return alert("Insufficient balance");

  users[wallet].balance -= amt;
  users[to].balance += amt;
  txs.push({ from: wallet, to, amount: amt });
  save();
  renderDashboard();
}

function addBalance() {
  const w = document.getElementById("aw").value.trim();
  const a = parseFloat(document.getElementById("aa").value);
  if (!users[w]) return alert("Wallet not found");
  users[w].balance += a;
  txs.push({ from: "SYSTEM", to: w, amount: a });
  save();
  renderDashboard();
}

function save() {
  localStorage.setItem("stabix_users", JSON.stringify(users));
  localStorage.setItem("stabix_txs", JSON.stringify(txs));
}
</script>
</body>
</html>
