<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family: Arial;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:12px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:15px;
    }
    button {
      background:#2563eb;
      color:white;
      font-weight:bold;
    }
    .small {
      font-size:12px;
      opacity:0.7;
      margin-top:10px;
    }
    hr {
      border:0;
      border-top:1px solid #1e293b;
      margin:15px 0;
    }
    .admin {
      border:1px solid #334155;
      padding:12px;
      border-radius:10px;
      background:#020617;
      margin-top:15px;
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
/* =========================
   CONFIG
========================= */
const ADMIN_WALLET = "0x6b7caa5b11106dfac2a415fd98e01e38c42f0e8d";

/* =========================
   STORAGE
========================= */
const wallet = localStorage.getItem("stabix_wallet");
const username = localStorage.getItem("stabix_username");

/* =========================
   DASHBOARD
========================= */
if (wallet && username) {

  let adminPanel = "";
  if (wallet.toLowerCase() === ADMIN_WALLET.toLowerCase()) {
    adminPanel = `
      <div class="admin">
        <h3>System Panel</h3>
        <p class="small">• Credit / Debit users<br>
        • Review transactions<br>
        • Sync balances</p>
      </div>
    `;
  }

  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>Welcome, ${username}</h2>

      <p class="small">Wallet</p>
      <p>${wallet}</p>

      <hr>

      <h3>Balance</h3>
      <p><b>USDC 0.00</b></p>

      <hr>

      <h3>Transactions</h3>
      <p class="small">No activity yet</p>

      ${adminPanel}

      <hr>

      <p class="small">
        🔐 Secure account<br>
        ⚡ Instant internal transfers<br>
        📈 Balance updates in real time
      </p>

      <button onclick="logout()">Logout</button>
    </div>
  `;
}

/* =========================
   REGISTRATION
========================= */
else {
  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>Create Account</h2>

      <input id="walletInput" placeholder="Wallet Address" />
      <input id="usernameInput" placeholder="Username (one-time)" />

      <button onclick="register()">Continue</button>

      <p class="small">
        Username cannot be changed later
      </p>
    </div>
  `;
}

function register() {
  const w = document.getElementById("walletInput").value.trim();
  const u = document.getElementById("usernameInput").value.trim();

  if (!w || !u) {
    alert("Fill all fields");
    return;
  }

  localStorage.setItem("stabix_wallet", w);
  localStorage.setItem("stabix_username", u);
  location.reload();
}

function logout() {
  localStorage.clear();
  location.reload();
}
</script>
</body>
</html>
