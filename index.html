<!DOCTYPE html>
<html>
<head>
<title>StabiX</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="app">Loading…</div>

<!-- ===== Transaction Popup ===== -->
<div id="txPopup" class="tx-popup">
<div class="tx-card">

<audio id="txSound" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3" type="audio/mpeg">
</audio>

<div class="spinner">
<svg viewBox="0 0 120 120">

<circle class="circle-bg" cx="60" cy="60" r="52"/>

<circle class="circle-progress" cx="60" cy="60" r="52"/>

<polyline id="tick" points="38,65 55,80 82,45"/>

<line id="crossLine1" x1="40" y1="40" x2="80" y2="80"
style="display:none;stroke:#ef4444;stroke-width:10;stroke-linecap:round"/>

<line id="crossLine2" x1="80" y1="40" x2="40" y2="80"
style="display:none;stroke:#ef4444;stroke-width:10;stroke-linecap:round"/>

</svg>
</div>

<div id="txTitle"
style="
font-size:22px;
font-weight:bold;
color:#22c55e;
margin-bottom:10px;
">
Transaction Successful
</div>

<div id="txMsg" style="font-size:16px;"></div>

<div id="txTime" class="small" style="margin-top:6px;"></div>

<button id="txDoneBtn"
style="margin-top:16px;background:#22c55e;color:#022c22;"
onclick="closeTxPopup(); window.goHome();">
DONE
</button>

</div>
</div>
  
 <!-- ===== Sending UI===== -->
<div id="sendScreen">
<div class="sendHeader">
<button onclick="closeSend()" class="backBtn">
  ←
</button>
<h2>Send USDC</h2>
</div>
<div class="sendBody">
<h1 class="sendTitle">Receiving address</h1>
<p class="sendSub">
Enter wallet address or domain name
</p>
<div class="addressBox">
<input
id="sendTo"
placeholder="Enter TG ID (TG_xxx)"
autocomplete="off"
/>
</div>
<button class="nextBtn" onclick="goAmount()">
Next
</button>
</div>

</div>

<div id="amountScreen" style="display:none">
<div class="sendHeader">
<button onclick="backToAddress()" class="backBtn">←</button>
<h2>Send USDC</h2>
</div>
<div class="sendBody">
<div class="sendIcon">⬆</div>
<h1 class="sendTitle">Enter amount</h1>
<input
id="sendAmt"
type="number"
inputmode="decimal"
placeholder="0"
class="amountInput"
/>
<button class="nextBtn" onclick="handleNext()">
Next
</button>
</div>

</div>
  
<div id="confirmScreen" style="display:none">
<div class="sendHeader">
<button onclick="backToAmount()" class="backBtn">←</button>
</div>
<div class="sendBody">
<h1 id="confirmAmount" style="font-size:56px;text-align:center;">
-0 USDC
</h1>
<hr>
<p>Transaction Fee</p>
<p>0 USDC</p>
<p>From</p>
<p id="confirmFrom"></p>
<p>To</p>
<p id="confirmTo"></p>
<div style="margin-top:30px;display:flex;gap:10px">
<button onclick="sendUSDC()" 
style="width:80%;margin:20px auto;padding:14px;background:#22c55e;color:#fff;border:none;border-radius:12px;display:block;">
Confirm
</button>
</button>
</div>
</div>
</div>
             
 <!-- ===== QR Code===== -->
 <script src="https://unpkg.com/html5-qrcode"></script> 

  <div id="scannerOverlay" style="
display:none;
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
z-index:99999;
">

  <div id="qr-reader" style="
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:9999;
"></div>

  <div id="scanBox" style="
  position:fixed;
  top:40%;
  left:50%;
  width:240px;
  height:240px;
  transform:translate(-50%, -50%);
  pointer-events:none;
">
  <!-- 4 corners -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  </div>

  <button onclick="closeScanner()" style="
    position:absolute;
    top:15px;
    left:15px;
    background:rgba(0,0,0,0.7);
    color:#fff;
    border:none;
    font-size:18px;
    width:40px;
    height:40px;
    border-radius:50%;
    z-index:100000;
  ">✕</button>
  
 <button id="torchBtn" onclick="toggleTorch()" style="
  position:absolute;
  top:15px;
  right:15px;
  background:rgba(0,0,0,0.7);
  color:#fff;
  border:none;
  font-size:18px;
  width:40px;
  height:40px;
  border-radius:50%;
  z-index:100000;
">
<svg width="26" height="26" viewBox="0 0 24 24" fill="white"
     style="transform:translate(-5px, -5px);">
    <path d="M6 2h12v3H6V2zm3 5h6c1.1 0 2 .9 2 2v11c0 1.1-.9 2-2 2H9c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2zm3 3a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/>
</svg>
  </button>

  <label for="galleryInput" id="galleryBtn" style="
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  background:#e5e7eb;
  color:#111;
  border:none;
  height:48px;
  padding:0 20px;
  border-radius:999px;
  font-size:15px;
  font-weight:500;
  z-index:100000;
  display:inline-flex;
  align-items:center;
  gap:8px;
  line-height:1;
">
<!-- Gallery Icon + Text -->
<span style="
  display:inline-flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  transform:translateY(15px);  
">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="display:block;">
    <rect x="3" y="5" width="18" height="14" rx="2" stroke="#555" stroke-width="1.5"/>
    <circle cx="8" cy="10" r="2" fill="#555"/>
    <path d="M21 16L16 11L5 19" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span>Upload From Gallery</span>
</span>
<input 
  type="file" 
  id="galleryInput" 
  accept="image/*" 
  style="display:none"
  onchange="handleGallery(event)">
 </div>

  <!-- Bottom Navigation -->
<div id="bottomNav" style="
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:420px;
  height:70px;
  background:rgba(2,6,23,0.9);
  backdrop-filter:blur(12px);
  border-radius:22px;
  display:none;
  justify-content:space-around;
  align-items:center;
  z-index:999;
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
">
  <div id="tab-home" onclick="goHome();selectTab('home')" style="flex:1;text-align:center;cursor:pointer">

     <div class="nav-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
  <path d="M3 10L12 3L21 10" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M5 10V20H19V10" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
     </div>
    
    <div class="nav-text">Home</div>
  </div>
  <div id="tab-deposit" onclick="goDeposit();selectTab('deposit')" style="flex:1;text-align:center;cursor:pointer">
    <div class="nav-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <path d="M12 3V15" stroke="white" stroke-width="2"/>
    <path d="M7 10L12 15L17 10" stroke="white" stroke-width="2"/>
    </svg>
    </div>
    <div class="nav-text">D/W</div>
  </div>
  <div id="tab-history" onclick="goHistory();selectTab('history')" style="flex:1;text-align:center;cursor:pointer">
    <div class="nav-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2"/>
    <path d="M12 7V12L15 14" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
    </div>
    <div class="nav-text">History</div>
  </div>
  <div id="tab-settings" onclick="goSettings();selectTab('settings')" style="flex:1;text-align:center;cursor:pointer">


   <div class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M19.4 15.05L18.3 14.65C18.05 14.55 17.85 14.35 17.75 14.1C17.65 13.85 17.65 13.55 17.75 13.3L18.15 12.2C18.35 11.7 18.2 11.1 17.75 10.8L16.2 9.9C15.85 9.7 15.4 9.8 15.15 10.1L14.45 10.95C14.25 11.2 13.95 11.3 13.65 11.25L12.5 11.05C12 10.95 11.5 11.15 11.2 11.55L10.3 12.8C10.1 13.05 9.8 13.2 9.5 13.2L8.25 13.15C7.75 13.1 7.25 13.4 7 13.85L6.2 15.25C6 15.6 6 16.05 6.25 16.4L7.3 17.9C7.55 18.25 7.95 18.45 8.4 18.4L9.65 18.3C9.95 18.25 10.25 18.35 10.5 18.55L11.4 19.35C11.75 19.65 12.25 19.7 12.65 19.45L14.05 18.55C14.35 18.35 14.7 18.3 15 18.4L16.1 18.75C16.6 18.9 17.15 18.7 17.45 18.3L18.85 16.55C19.1 16.2 19.1 15.7 18.85 15.35L19.4 15.05Z" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 7L12 4L15 7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
 
    
    <div class="nav-text">Settings</div>
  </div>
</div>


  
  <script type="module" src="./js/app.js"></script>
  
 <!-- ===== Error Tool===== -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<script>
window.onerror = function(msg, url, line, col, error) {
  console.log("❌ ERROR:", msg);
  console.log("📍 File:", url);
  console.log("📌 Line:", line, "Column:", col);
};
</script>


  
</body>
</html>
