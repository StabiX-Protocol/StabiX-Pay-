<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family: Arial;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:12px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      font-size:15px;
    }
    button {
      background:#2563eb;
      color:white;
      font-weight:bold;
    }
    .small {
      font-size:12px;
      opacity:0.7;
    }
    hr {
      border:0;
      border-top:1px solid #1e293b;
      margin:15px 0;
    }
    .tx {
      font-size:13px;
      margin-top:6px;
      opacity:0.9;
    }
  </style>
</head>

<body>
<div id="app"></div>

<script>
/* =========================
   CONFIG
========================= */
const ADMIN_WALLET = "0x6b7caa5b11106dfac2a415fd98e01e38c42f0e8d";

/* =========================
   LOAD USER
========================= */
const wallet = localStorage.getItem("stabix_wallet");
const username = localStorage.getItem("stabix_username");

let users = JSON.parse(localStorage.getItem("stabix_users") || "{}");
let txs = JSON.parse(localStorage.getItem("stabix_txs") || []);

/* =========================
   DASHBOARD
========================= */
if (wallet && username) {

  if (!users[username]) {
    users[username] = { balance: 0 };
    localStorage.setItem("stabix_users", JSON.stringify(users));
  }

  render();

} else {
  renderRegister();
}

/* =========================
   RENDER FUNCTIONS
========================= */
function render() {
  const balance = users[username].balance;

  let history = txs
    .filter(t => t.from === username || t.to === username)
    .slice(-5)
    .reverse()
    .map(t => `
      <div class="tx">
        ${t.from} → ${t.to} : ${t.amount} USDC
      </div>
    `).join("");

  if (!history) history = `<p class="small">No transactions yet</p>`;

  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>${username}</h2>
      <p class="small">${wallet}</p>

      <hr>

      <h3>Balance</h3>
      <p><b>${balance.toFixed(2)} USDC</b></p>

      <hr>

      <h3>Send USDC</h3>
      <input id="toUser" placeholder="Receiver Username" />
      <input id="amount" type="number" placeholder="Amount" />
      <button onclick="send()">Send</button>

      <hr>

      <h3>Recent Activity</h3>
      ${history}

      <hr>

      <button onclick="logout()">Logout</button>
    </div>
  `;
}

function renderRegister() {
  document.getElementById("app").innerHTML = `
    <div class="box">
      <h2>Create Account</h2>
      <input id="walletInput" placeholder="Wallet Address" />
      <input id="usernameInput" placeholder="Username (one-time)" />
      <button onclick="register()">Continue</button>
    </div>
  `;
}

/* =========================
   ACTIONS
========================= */
function register() {
  const w = walletInput.value.trim();
  const u = usernameInput.value.trim();

  if (!w || !u) return alert("Fill all fields");

  localStorage.setItem("stabix_wallet", w);
  localStorage.setItem("stabix_username", u);
  location.reload();
}

function send() {
  const to = document.getElementById("toUser").value.trim();
  const amt = parseFloat(document.getElementById("amount").value);

  if (!users[to]) return alert("User not found");
  if (amt <= 0) return alert("Invalid amount");
  if (users[username].balance < amt) return alert("Insufficient balance");

  users[username].balance -= amt;
  users[to].balance += amt;

  txs.push({ from: username, to, amount: amt });

  localStorage.setItem("stabix_users", JSON.stringify(users));
  localStorage.setItem("stabix_txs", JSON.stringify(txs));

  render();
}

function logout() {
  localStorage.clear();
  location.reload();
}
</script>
</body>
</html>
