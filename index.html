<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family:Arial;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:12px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
  </style>
</head>

<body>
<div id="app">Booting…</div>

<script>
/* ================= SAFE TELEGRAM INIT ================= */
let tgUser = null;

try {
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tgUser = tg.initDataUnsafe?.user || null;
  }
} catch (e) {
  console.log("Telegram not available");
}

/* ================= USER FALLBACK ================= */
if (!tgUser) {
  tgUser = {
    id: "browser_test",
    username: "BrowserUser"
  };
}

const WALLET = "TG_" + tgUser.id;
const USERNAME = tgUser.username || "User";

/* ================= RENDER ================= */
document.getElementById("app").innerHTML = `
  <div class="box">
    <h2>StabiX Loaded ✅</h2>
    <p>User: ${USERNAME}</p>
    <p>Wallet: ${WALLET}</p>
    <p>Status: No crash</p>
  </div>
`;
</script>
</body>
</html>
