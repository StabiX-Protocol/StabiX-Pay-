window.changeUsername = async ()=>{

  await updateDoc(userRef,{ username:name.trim(), lastUsernameChange:serverTimestamp() });
  renderApp();

/* ================= SEND USDC ================= */
window.sendUSDC = async ()=>{
  const snap = await getDoc(userRef);
if(snap.data().pendingRequest){
  alert("Account frozen. Wait for validator approval.");
  return;
}
  const toWallet = sendTo.value.trim();
  const amount = Number(sendAmt.value);
  if(!toWallet || amount<=0) return alert("Invalid input");
  if(toWallet === WALLET){
    tg.showPopup({ title:"Blocked", message:"Cannot send to yourself", buttons:[{type:"ok"}] });
    return;
  }

  try{
    await runTransaction(db, async(tx)=>{
      const fromSnap = await tx.get(userRef);
      const toRef = doc(db,"users",toWallet);
      const toSnap = await tx.get(toRef);
      if(!toSnap.exists()) throw "Receiver not found";
      if(fromSnap.data().balance < amount) throw "Insufficient balance";

      tx.update(userRef,{ balance: fromSnap.data().balance - amount });
      tx.update(toRef,{ balance: toSnap.data().balance + amount });

      tx.set(doc(collection(db,"transactions")),{
        userId: WALLET, type:"sent", amount, counterparty:toWallet, createdAt:serverTimestamp()
      });
      tx.set(doc(collection(db,"transactions")),{
        userId: toWallet, type:"received", amount, counterparty:WALLET, createdAt:serverTimestamp()
      });
    });
    showTxPopup(`Sent ${amount} USDC to ${toWallet}`);
    renderApp();
  }catch(e){ alert(e); }
};

async function loadHistory() {
  const q = query(
    collection(db, "transactions"),
    where("userId", "==", WALLET)
  );

  const snap = await getDocs(q);
  renderHistoryFromSnap(snap, "No transactions");

window.loadHistoryByDate = async () => {
  const selected = document.getElementById("historyDate")?.value;

  if (!selected) {
    loadHistory(); // fallback
    return;
  }

  const startDate = new Date(selected);
startDate.setHours(0, 0, 0, 0);

const endDate = new Date(selected);
endDate.setHours(23, 59, 59, 999);

const start = Timestamp.fromDate(startDate);
const end = Timestamp.fromDate(endDate);
  const q = query(
    collection(db, "transactions"),
    where("userId", "==", WALLET),
    where("createdAt", ">=", start),
    where("createdAt", "<=", end)
  );

  const snap = await getDocs(q);
  renderHistoryFromSnap(snap, "No transactions for this date");
};

/* ================= HISTORY RENDER ================= */

function renderHistoryFromSnap(snap, emptyText) {
  let html = "";

  snap.forEach(d => {
    const t = d.data();

    const isDepositWithdraw =
      t.type === "deposit" || t.type === "withdraw";

    const isCredit = isDepositWithdraw
      ? t.type === "deposit"
      : t.type === "received";

    const sign = isCredit ? "+" : "-";
    const color = isCredit ? "#22c55e" : "#ef4444";

    const metaLine = isDepositWithdraw
      ? t.type.toUpperCase()
      : (isCredit
          ? `${t.counterparty} → ${WALLET}`
          : `${WALLET} → ${t.counterparty}`);

    html += `
      <div class="tx" style="color:${color}">
        <b>${sign}${t.amount} USDC</b><br>
        <span class="small">
          ${metaLine}<br>
          ${t.createdAt?.toDate()?.toLocaleString() || ""}
        </span>
      </div>
    `;
  });

  document.getElementById("history").innerHTML =
    html || `<span class="small">${emptyText}</span>`;
}

    await runTransaction(db, async(tx)=>{
      const snap = await tx.get(targetRef);
      if(!snap.exists()) throw "User not found";

      let bal = snap.data().balance;

      if(type === "deposit"){
        bal += amount;
      }else{
        bal -= amount;
      }

      if(bal < 0) throw "Insufficient balance";

      tx.update(targetRef,{ balance: bal });

      tx.set(doc(collection(db,"transactions")),{
        userId: uid,
        type: type,              // deposit / withdraw
        amount: amount,
        counterparty: "VALIDATOR",
        createdAt: serverTimestamp()
      });
    });

    alert("Balance updated successfully");
  }catch(e){
    alert("Validator error: " + e);
  }
};
  window.loadRequests = async ()=>{
  const q = query(
    collection(db,"requests"),
    where("status","==","pending")
  );

  const snap = await getDocs(q);
  let html = "";

  snap.forEach(d=>{
    const r = d.data();

    const time = r.createdAt
      ? r.createdAt.toDate().toLocaleString()
      : "";

    html += `
      <div class="tx">
        <b>${r.type.toUpperCase()} ${r.amount} USDC</b><br>

        <span class="small">
          User ID: ${r.userId}<br>
          Wallet: ${r.walletAddress}<br>
          ${r.txHash ? `Tx Hash: ${r.txHash}<br>` : ""}
          Time: ${time}
        </span>

        <br><br>
        <button onclick="approveReq('${d.id}')">Approve</button>
        <button onclick="rejectReq('${d.id}')">Reject</button>
      </div>
    `;
  });

  document.getElementById("vout").innerHTML =
    html || "<span class='small'>No pending requests</span>";
};
  window.loadAllUsers = async ()=>{
  const listDiv = document.getElementById("userList");
  const countDiv = document.getElementById("userCount");

  listDiv.innerHTML = "Loading...";
  countDiv.innerHTML = "";

  try{
    const snap = await getDocs(collection(db,"users"));

    countDiv.innerHTML = `Total Users: <b>${snap.size}</b>`;

    let html = "";

      const username = u.username ? u.username : "No username";
      const tgWallet = u.walletAddress ? u.walletAddress : d.id;
      const eoa = u.eoaAddress ? u.eoaAddress : "Not added";

      html += `

          <b>${username}</b><br>

          <span class="small">
            TG: ${tgWallet}
          </span><br>

          <span class="small">
            EOA: ${eoa}
          </span>
        </div>

    listDiv.innerHTML =
      html || "<span class='small'>No users found</span>";

  }catch(e){
    listDiv.innerHTML =
      "<span class='small'>Error loading users</span>";
  }
};
  window.approveReq = async (reqId)=>{

  const reqRef = doc(db,"requests",reqId);

  await runTransaction(db, async(tx)=>{

    const reqSnap = await tx.get(reqRef);
    if(!reqSnap.exists()) throw "Request not found";

    const r = reqSnap.data();

    const userRefX = doc(db,"users",r.userId);
    const userSnap = await tx.get(userRefX);

    if(!userSnap.exists()) throw "User not found";

    let bal = userSnap.data().balance || 0;

    // Deposit approve
    if(r.type === "deposit"){
      bal = bal + r.amount;
    }

    // Withdraw approve
    if(r.type === "withdraw"){
      if(bal < r.amount) throw "Insufficient balance";
      bal = bal - r.amount;
    }

    // update user
    tx.update(userRefX,{
      balance: bal,
      pendingRequest:false
    });

    // mark request approved
    tx.update(reqRef,{
      status:"approved"
    });

    // add transaction history
    tx.set(doc(collection(db,"transactions")),{
      userId: r.userId,
      type: r.type,
      amount: r.amount,
      counterparty:"VALIDATOR",
      createdAt: serverTimestamp()
    });

  });

  alert("Request approved");
  loadRequests();
};

  window.rejectReq = async (reqId)=>{
  const reqRef = doc(db,"requests",reqId);
  const snap = await getDoc(reqRef);

  await updateDoc(doc(db,"users", snap.data().userId),{
    pendingRequest:false   // 🔓 UNFREEZE
  });

  await updateDoc(reqRef,{ status:"rejected" });

  alert("Rejected");
  loadRequests();
  renderApp();
};
  window.checkUserBalance = async ()=>{
  const uid = document.getElementById("vUser").value.trim();
  const out = document.getElementById("balanceOut");

  if(!uid){
    out.innerText = "Enter User ID";
    return;
  }

  try{
    const snap = await getDoc(doc(db,"users",uid));
    if(!snap.exists()){
      out.innerText = "User not found";
      return;
    }

    out.innerText =
      `Balance: ${snap.data().balance.toFixed(2)} USDC`;
  }catch(e){
    out.innerText = "Error fetching balance";
  }
};
  function showTxPopup(msg){
  const pop = document.getElementById("txPopup");
  const spin = document.getElementById("txSpinner");
  const check = document.getElementById("txCheck");
  const txt = document.getElementById("txMsg");
  const time = document.getElementById("txTime");
  const doneBtn = document.getElementById("txDoneBtn");

  // message + time
  txt.innerText = msg;
  time.innerText = new Date().toLocaleString();

  // ✅ FINAL STATE (NO TIMER)
  spin.style.display = "none";      // ❌ spinner band
  check.style.display = "block";    // ✅ success
  doneBtn.style.display = "block";  // ✅ DONE button
  pop.style.display = "flex";
  }

  window.closeTxPopup = function (){
  const pop = document.getElementById("txPopup");
  if(pop) pop.style.display = "none";
};
  // ✅ DONE button handler (module-safe)
const doneBtnEl = document.getElementById("txDoneBtn");
if (doneBtnEl) {
  doneBtnEl.addEventListener("click", () => {
    const pop = document.getElementById("txPopup");
    if (pop) pop.style.display = "none";
  });
}
  window.softRefresh = async function(){

    // 🔄 re-fetch user data
    const snap = await getDoc(userRef);
    if(!snap.exists()){
      alert("Session expired");
      return;
    }

    // 🔁 sirf UI refresh
    renderApp();
  }catch(e){
    alert("Refresh failed");
  }
};
  // ================= EOA WALLET =================
window.editEOA = async ()=>{
  const snap = await getDoc(userRef);
  const current = snap.data()?.eoaAddress;

  const addr = prompt(
    "Enter your EOA Wallet Address",
    current || ""
  );

  if(!addr) return;

  if(addr.length < 20){
    alert("Invalid wallet address");
    return;
  }

  // 🔒 LOCK
  if (current) {
    alert("EOA wallet already locked");
    return;
  }

  await updateDoc(userRef,{
    eoaAddress: addr.trim()
  });

  alert("EOA wallet locked successfully");
  renderApp();
};
