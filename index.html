<!DOCTYPE html>
<html>
<head>
  <title>StabiX Ledger - Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background:#0f172a;
      color:#e5e7eb;
      font-family: Arial;
      padding:20px;
    }
    .box {
      background:#020617;
      border:1px solid #1e293b;
      border-radius:10px;
      padding:20px;
      max-width:420px;
      margin:auto;
    }
    input, button {
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:none;
    }
    button {
      background:#2563eb;
      color:white;
      font-weight:bold;
    }
    .small {
      font-size:12px;
      opacity:0.7;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Register on StabiX Ledger</h2>

    <input id="wallet" placeholder="Wallet Address" />
    <input id="username" placeholder="Choose Username (one-time)" />

    <button onclick="register()">Register</button>

    <p class="small">
      ⚠️ Username cannot be changed later  
      <br>Ledger is off-chain, settlement by admin
    </p>
  </div>

<script>
function register() {
  const wallet = document.getElementById("wallet").value;
  const username = document.getElementById("username").value;

  if (!wallet || !username) {
    alert("Fill all fields");
    return;
  }

  alert(
    "Registered Successfully\n\nWallet: " + wallet +
    "\nUsername: " + username +
    "\n\n(Next step UI will unlock later)"
  );
}
</script>

</body>
</html>
