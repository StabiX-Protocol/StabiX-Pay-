<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
    .warn { color:#facc15; font-size:13px; }
    .link { color:#60a5fa; font-size:13px; cursor:pointer; margin-top:10px; display:block; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp,
  query, where, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1",
  storageBucket: "stabix-backend-v1.firebasestorage.app",
  messagingSenderId: "351361221507",
  appId: "1:351361221507:web:ebaf0d15e86d4b184c6cb6"
};

const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);

/* ================= TELEGRAM ================= */
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const tgUser = tg.initDataUnsafe?.user;
if(!tgUser || !tgUser.id){
  document.getElementById("app").innerHTML = "Telegram user not found";
  throw "";
}

/* ================= IDENTITY ================= */
const WALLET = "TG_" + tgUser.id;
const userRef = doc(db,"users",WALLET);
const validatorRef = doc(db,"validators",String(tgUser.id));

let OTP_CODE = null;

/* ================= INIT ================= */
async function init(){
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    renderSetup();
    return;
  }

  const user = snap.data();

  if(!user.password){
    renderSetPassword();
    return;
  }

  renderLogin();
}

/* ================= SETUP ================= */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Username</h3>
      <input id="uname" placeholder="Username">
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="saveProfile()">Save</button>
    </div>
  `);
}

window.saveProfile = async ()=>{
  if(!uname.value.trim() || !pwd.value.trim()) return alert("Fill all fields");

  await setDoc(userRef,{
    username: uname.value.trim(),
    password: pwd.value.trim(),
    walletAddress: WALLET,
    balance: 0,
    pendingRequest:false,
    createdAt: serverTimestamp()
  });

  renderApp();
};

/* ================= LOGIN ================= */
function renderLogin(){
  appDiv(`
    <div class="box">
      <h3>Enter Password</h3>
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <span class="link" onclick="forgotPassword()">Forgot Password?</span>
    </div>
  `);
}

window.login = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().password !== pwd.value.trim()){
    alert("Wrong password");
    return;
  }
  renderApp();
};

/* ================= FORGOT PASSWORD ================= */
window.forgotPassword = async ()=>{
  OTP_CODE = Math.floor(100000 + Math.random() * 900000).toString();

  await updateDoc(userRef,{ otp: OTP_CODE });

  tg.showPopup({
    title: "StabiX OTP",
    message: "Your OTP: " + OTP_CODE,
    buttons: [{type:"ok"}]
  });

  renderOTP();
};

function renderOTP(){
  appDiv(`
    <div class="box">
      <h3>Verify OTP</h3>
      <input id="otp" placeholder="OTP">
      <input id="npwd" type="password" placeholder="New Password">
      <button onclick="verifyOTP()">Reset Password</button>
      <span class="link" onclick="forgotPassword()">Resend OTP</span>
    </div>
  `);
}

window.verifyOTP = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().otp !== otp.value.trim()){
    alert("Invalid OTP");
    return;
  }

  await updateDoc(userRef,{
    password: npwd.value.trim(),
    otp: ""
  });

  renderLogin();
};

/* ================= MAIN APP ================= */
async function renderApp(){
  const user = (await getDoc(userRef)).data();
  const isValidator = (await getDoc(validatorRef)).exists();

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>

      <b>Balance:</b> ${user.balance.toFixed(2)} USDC

      <hr>
      <select id="type">
        <option value="deposit">Deposit</option>
        <option value="withdraw">Withdraw</option>
      </select>
      <input id="amt" type="number" placeholder="Amount">
      <input id="waddr" placeholder="Wallet Address">
      <input id="txh" placeholder="Tx Hash (deposit)">
      <button onclick="submitReq()">Submit</button>

      <hr>
      <h3>History</h3>
      <div id="history">Loading…</div>

      ${isValidator ? validatorPanel() : ""}
    </div>
  `);

  loadHistory();
}

/* ================= REQUEST ================= */
window.submitReq = async ()=>{
  await addDoc(collection(db,"requests"),{
    userId: WALLET,
    amount: Number(amt.value),
    type: type.value,
    walletAddress: waddr.value,
    txHash: txh.value || "",
    status:"pending",
    createdAt: serverTimestamp()
  });

  alert("Request sent");
};

/* ================= HISTORY ================= */
async function loadHistory(){
  const q = query(
    collection(db,"transactions"),
    where("userId","==",WALLET),
    orderBy("createdAt","desc")
  );

  const snap = await getDocs(q);
  let html="";

  snap.forEach(d=>{
    const t=d.data();
    html+=`<div class="tx">${t.type} - ${t.amount}</div>`;
  });

  document.getElementById("history").innerHTML = html || "No history";
}

/* ================= VALIDATOR ================= */
function validatorPanel(){
  return `
    <hr>
    <h3>Validator Panel</h3>
    <button onclick="loadRequests()">Load Requests</button>
    <div id="vout"></div>
  `;
}

window.loadRequests = async ()=>{
  const snap = await getDocs(collection(db,"requests"));
  let html="";
  snap.forEach(d=>{
    const r=d.data();
    if(r.status==="pending"){
      html+=`<div class="tx">${r.userId} - ${r.amount}</div>`;
    }
  });
  vout.innerHTML = html || "No pending";
};

/* ================= UTIL ================= */
function appDiv(h){
  document.getElementById("app").innerHTML = h;
}

init();
</script>
</body>
</html>
