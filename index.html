<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ========= FIREBASE ========= */
const appFB = initializeApp({
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1"
});
const db = getFirestore(appFB);

/* ========= TELEGRAM ========= */
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const tgUser = tg.initDataUnsafe?.user;
if(!tgUser?.id){ document.getElementById("app").innerHTML="Telegram user not found"; throw ""; }

/* ========= USER ========= */
const WALLET = "TG_" + tgUser.id;
const userRef = doc(db,"users",WALLET);

/* ========= INIT ========= */
async function init(){
  const snap = await getDoc(userRef);
  if(!snap.exists() || !snap.data().password){
    renderSetup(); return;
  }
  renderLogin();
}

/* ========= SETUP ========= */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Account</h3>
      <input id="uname" placeholder="Username">
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="saveProfile()">Create</button>
    </div>
  `);
}

window.saveProfile = async ()=>{
  if(!uname.value || !pwd.value) return alert("Fill all");
  await setDoc(userRef,{
    username: uname.value,
    password: pwd.value,
    balance: 0,
    createdAt: serverTimestamp()
  });
  renderApp();
};

/* ========= LOGIN ========= */
function renderLogin(){
  appDiv(`
    <div class="box">
      <h3>Login</h3>
      <input id="pwd" type="password" placeholder="Password">
      <div style="display:flex;gap:10px;align-items:center">
        <button onclick="login()">Login</button>
        <span style="font-size:12px;color:#60a5fa;cursor:pointer"
              onclick="forgotPassword()">Forgot?</span>
      </div>
    </div>
  `);
}

window.login = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().password !== pwd.value) return alert("Wrong password");
  renderApp();
};

/* ========= FORGOT PASSWORD ========= */
window.forgotPassword = async ()=>{
  const otp = Math.floor(100000 + Math.random()*900000).toString();
  await updateDoc(userRef,{ otp });
  alert("OTP: " + otp);
  renderOTP();
};

function renderOTP(){
  appDiv(`
    <div class="box">
      <h3>Reset Password</h3>
      <input id="otp" placeholder="OTP">
      <input id="npwd" type="password" placeholder="New Password">
      <button onclick="verifyOTP()">Reset</button>
    </div>
  `);
}

window.verifyOTP = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().otp !== otp.value) return alert("Invalid OTP");
  await updateDoc(userRef,{ password: npwd.value, otp:"" });
  renderLogin();
};

/* ========= MAIN APP ========= */
async function renderApp(){
  const user = (await getDoc(userRef)).data();
  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>
      <hr>
      <b>Balance:</b> ${user.balance} USDC
      <hr>
      <p class="small">App opened successfully ✅</p>
    </div>
  `);
}

/* ========= UTILS ========= */
function appDiv(h){ document.getElementById("app").innerHTML = h; }

init();
</script>
</body>
</html>
