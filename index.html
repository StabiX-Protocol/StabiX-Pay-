<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; font-size:15px; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    button:disabled { background:#334155; cursor:not-allowed; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; margin-top:8px; padding-bottom:8px; border-bottom:1px dashed #1e293b; }
    .warn { color:#facc15; font-size:13px; margin-top:10px; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  arrayUnion, collection, addDoc, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBWWPgitPhLIYbR-ZmezpaP155cpn1_KPY",
  authDomain: "stabix-49cc6.firebaseapp.com",
  projectId: "stabix-49cc6",
  storageBucket: "stabix-49cc6.appspot.com",
  messagingSenderId: "68502925473",
  appId: "1:68502925473:web:86959dae39a377413800e0"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* TELEGRAM */
const tg = window.Telegram?.WebApp;
tg?.ready();

const ADMIN_TG_ID = "1303497305";
const tgUser = tg?.initDataUnsafe?.user || { id:"browser", username:"Browser" };

const wallet = "TG_" + tgUser.id;
const userRef = doc(db,"users",wallet);
const requestsRef = collection(db,"requests");

/* INIT */
async function init(){
  const snap = await getDoc(userRef);
  if(!snap.exists()){
    appDiv(`
      <div class="box">
        <h3>Create Username</h3>
        <input id="uname" placeholder="Username" />
        <button onclick="saveUsername()">Save</button>
      </div>
    `);
    return;
  }
  render();
}

window.saveUsername = async ()=>{
  if(!uname.value.trim()) return alert("Enter username");
  await setDoc(userRef,{
    username:uname.value.trim(),
    balance:0,
    history:[],
    pendingRequest:false
  });
  render();
};

/* RENDER */
async function render(){
  const snap = await getDoc(userRef);
  const user = snap.data();
  const locked = user.pendingRequest===true;
  const isAdmin = String(tgUser.id)===ADMIN_TG_ID;

  let grouped={};
  user.history.forEach(tx=>{
    const d=new Date(tx.time).toISOString().slice(0,10);
    if(!grouped[d]) grouped[d]=[];
    grouped[d].push(tx);
  });

  let historyHtml="";
  Object.keys(grouped).sort().reverse().forEach(date=>{
    historyHtml+=`<hr><b>${date}</b>`;
    grouped[date].reverse().forEach(tx=>{
      const red=["Sent","Withdraw"].includes(tx.type);
      historyHtml+=`
        <div class="tx" style="color:${red?"#ef4444":"#22c55e"}">
          <b>${tx.type}</b>: ${tx.amount} USDC<br>
          <span class="small">From: ${tx.from}<br>To: ${tx.to}</span><br>
          <span class="small">TG ID: ${tx.user}</span><br>
          <span class="small">${new Date(tx.time).toLocaleString()}</span>
        </div>`;
    });
  });

  if(!historyHtml) historyHtml="<p class='small'>No transactions</p>";

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${wallet}</p>

      <hr><h3>Balance</h3>
      <b>${user.balance.toFixed(2)} USDC</b>

      ${locked?`<div class="warn">⏳ Pending admin approval</div>`:""}

      <hr><h3>Send USDC</h3>
      <input id="to" placeholder="Receiver Wallet" ${locked?"disabled":""}>
      <input id="amt" type="number" placeholder="Amount" ${locked?"disabled":""}>
      <button onclick="send()" ${locked?"disabled":""}>Send</button>

      <hr><h3>Deposit / Withdraw</h3>
      <select id="txType" onchange="toggleHash()" ${locked?"disabled":""}>
        <option value="deposit">Deposit</option>
        <option value="withdraw">Withdraw</option>
      </select>
      <input id="rw" placeholder="Wallet Address" ${locked?"disabled":""}>
      <input id="ra" type="number" placeholder="Amount" ${locked?"disabled":""}>
      <input id="rh" placeholder="Tx Hash (deposit only)">
      <button onclick="submitRequest()" ${locked?"disabled":""}>Submit Request</button>

      <hr><h3>Transaction History</h3>
      <input type="date" onchange="filterDate(this.value)">
      <div id="historyBox">${historyHtml}</div>

      ${isAdmin?adminPanel():""}
    </div>
  `);
  toggleHash();
}

/* TOGGLE HASH */
window.toggleHash=()=>rh.style.display=txType.value==="deposit"?"block":"none";

/* SUBMIT REQUEST */
window.submitRequest=async()=>{
  const snap=await getDoc(userRef);
  if(txType.value==="withdraw" && ra.value>snap.data().balance)
    return alert("Incorrect amount");

  await addDoc(requestsRef,{
    user:wallet,
    userId:tgUser.id,
    type:txType.value,
    amount:Number(ra.value),
    walletAddress:rw.value,
    txHash:txType.value==="deposit"?rh.value:"",
    status:"pending",
    time:serverTimestamp()
  });

  await updateDoc(userRef,{pendingRequest:true});
  alert("Request sent");
  render();
};

/* ADMIN PANEL (ORIGINAL + APPROVE REJECT ADDON) */
function adminPanel(){
  return `
    <hr><h3>Admin Panel</h3>
    <button onclick="loadRequests()">Refresh Requests</button>
    <div id="reqList"></div>
  `;
}

window.loadRequests=async()=>{
  const snap=await getDocs(requestsRef);
  let h="";
  snap.forEach(d=>{
    const r=d.data();
    if(r.status!=="pending") return;
    h+=`
      <div class="tx">
        <b>${r.type.toUpperCase()}</b><br>
        User: ${r.user}<br>
        Amount: ${r.amount}<br>
        Wallet: ${r.walletAddress}<br>
        <span class="small">${r.time?.toDate().toLocaleString()}</span><br>
        <button onclick="approve('${d.id}','${r.user}')">Approve</button>
        <button onclick="reject('${d.id}','${r.user}')">Reject</button>
      </div>`;
  });
  reqList.innerHTML=h||"<p class='small'>No pending</p>";
};

window.approve=async(id,u)=>{
  await updateDoc(doc(db,"requests",id),{status:"approved"});
  await updateDoc(doc(db,"users",u),{pendingRequest:false});
  alert("Approved");
  loadRequests();
};

window.reject=async(id,u)=>{
  await updateDoc(doc(db,"requests",id),{status:"rejected"});
  await updateDoc(doc(db,"users",u),{pendingRequest:false});
  alert("Rejected");
  loadRequests();
};

/* FILTER HISTORY */
window.filterDate=(d)=>{
  document.querySelectorAll(".tx").forEach(t=>{
    t.style.display = t.innerHTML.includes(d) ? "block":"none";
  });
};

function appDiv(h){document.getElementById("app").innerHTML=h;}
init();
</script>
</body>
</html>
