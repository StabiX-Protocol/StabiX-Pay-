<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; font-size:15px; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; margin-top:8px; padding-bottom:8px; border-bottom:1px dashed #1e293b; }
  </style>
</head>

<body>
<div id="app">Connecting…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc,
  collection, query, where, orderBy,
  onSnapshot, Timestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ===== CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1",
  storageBucket: "stabix-backend-v1.firebasestorage.app",
  messagingSenderId: "351361221507",
  appId: "1:351361221507:web:ebaf0d15e86d4b184c6cb6"
};

const VALIDATOR_UID = "V2pWpWhfymg1rDQfnyneQdCLU7q1";

/* ===== INIT ===== */
const appFB = initializeApp(firebaseConfig);
const auth = getAuth(appFB);
const db   = getFirestore(appFB);

let uid = null;
let unsubHistory = null;

/* ===== AUTH ===== */
signInAnonymously(auth);

onAuthStateChanged(auth, async user=>{
  if(!user) return;
  uid = user.uid;

  const snap = await getDoc(doc(db,"users",uid));
  if(!snap.exists()){
    renderSetup();
  } else {
    renderDashboard(snap.data());
    initHistory();
  }
});

/* ===== UI ===== */
function appDiv(html){
  document.getElementById("app").innerHTML = html;
}

/* ===== SETUP ===== */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Setup Profile</h3>
      <input id="uname" placeholder="Username">
      <input id="wallet" placeholder="Wallet Address">
      <button onclick="saveProfile()">Save</button>
    </div>
  `);
}

window.saveProfile = async ()=>{
  if(!uname.value || !wallet.value) return alert("Fill all");
  const userData = {
    username: uname.value.trim(),
    walletAddress: wallet.value.trim(),
    balance: 0,
    createdAt: new Date()
  };
  await setDoc(doc(db,"users",uid), userData);
  renderDashboard(userData);
  initHistory();
};

/* ===== DASHBOARD ===== */
function renderDashboard(user){
  const isValidator = uid === VALIDATOR_UID;

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${uid}</p>

      <hr><h3>Balance</h3>
      <b>${(user.balance||0).toFixed(2)} USDC</b>

      <hr><h3>Transaction History</h3>
      <input type="date" id="historyDate">
      <div id="historyBox" class="small">Loading…</div>

      ${isValidator?`
        <hr>
        <h3>Validator Panel</h3>
        <input id="vuid" placeholder="User UID">
        <button onclick="viewUser()">View</button>
        <p class="small">Balance: <span id="vbal">-</span></p>
      `:""}
    </div>
  `);
}

/* ===== HISTORY ===== */
function initHistory(){
  const today = new Date().toISOString().slice(0,10);
  const dateEl = document.getElementById("historyDate");
  dateEl.value = today;
  dateEl.onchange = ()=>loadHistory(dateEl.value);
  loadHistory(today);
}

function loadHistory(date){
  if(unsubHistory) unsubHistory();

  const start = Timestamp.fromDate(new Date(date+"T00:00:00"));
  const end   = Timestamp.fromDate(new Date(date+"T23:59:59"));

  const q = query(
    collection(db,"transactions"),
    where("userId","==",uid),
    where("createdAt",">=",start),
    where("createdAt","<=",end),
    orderBy("createdAt","desc")
  );

  unsubHistory = onSnapshot(q, snap=>{
    let html="";
    snap.forEach(d=>{
      const t=d.data();
      html+=`
        <div class="tx">
          <b>${t.type}</b>: ${t.amount} USDC<br>
          <span class="small">${t.createdAt.toDate().toLocaleString()}</span>
        </div>
      `;
    });
    document.getElementById("historyBox").innerHTML = html || "No transactions";
  });
}

/* ===== VALIDATOR ===== */
window.viewUser = async ()=>{
  const id=document.getElementById("vuid").value.trim();
  if(!id) return;
  const snap=await getDoc(doc(db,"users",id));
  document.getElementById("vbal").innerText =
    snap.exists()?snap.data().balance:"Not found";
};
</script>
</body>
</html>
