<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#2563eb; color:white; font-weight:bold; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
    .warn { color:#facc15; font-size:13px; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp, query, where, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ===== FIREBASE CONFIG (NEW SDK) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1",
  storageBucket: "stabix-backend-v1.firebasestorage.app",
  messagingSenderId: "351361221507",
  appId: "1:351361221507:web:ebaf0d15e86d4b184c6cb6"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* ===== TELEGRAM INIT ===== */
const tg = window.Telegram.WebApp;
tg.ready();

const tgUser = tg.initDataUnsafe.user;
if(!tgUser){
  document.getElementById("app").innerHTML = "Telegram required";
  throw "";
}

/* ===== IDENTITY ===== */
const WALLET = "TG_" + tgUser.id;
const userRef = doc(db,"users",WALLET);
const validatorRef = doc(db,"validators",String(tgUser.id));

/* ===== INIT ===== */
async function init(){
  const userSnap = await getDoc(userRef);
  if(!userSnap.exists()){
    return renderSetup();
  }
  renderApp();
}

/* ===== SETUP ===== */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Username</h3>
      <input id="uname" placeholder="Username">
      <button onclick="saveProfile()">Save</button>
    </div>
  `);
}

window.saveProfile = async ()=>{
  if(!uname.value.trim()) return alert("Enter username");

  await setDoc(userRef,{
    username: uname.value.trim(),
    walletAddress: WALLET,
    balance: 0,
    pendingRequest: false,
    createdAt: serverTimestamp()
  });

  renderApp();
};

/* ===== MAIN APP ===== */
async function renderApp(){
  const user = (await getDoc(userRef)).data();
  const isValidator = (await getDoc(validatorRef)).exists();

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>

      <hr><b>Balance:</b> ${user.balance.toFixed(2)} USDC
      ${user.pendingRequest?`<div class="warn">Pending approval</div>`:""}

      <hr>
      <h3>Deposit / Withdraw</h3>
      <select id="type">
        <option value="deposit">Deposit</option>
        <option value="withdraw">Withdraw</option>
      </select>
      <input id="amt" type="number" placeholder="Amount">
      <input id="waddr" placeholder="Wallet Address">
      <input id="txh" placeholder="Tx Hash (deposit)">
      <button onclick="submitReq()">Submit</button>

      <hr>
      <h3>History</h3>
      <div id="history"></div>

      ${isValidator?validatorPanel():""}
    </div>
  `);

  loadHistory();
}

/* ===== REQUEST ===== */
window.submitReq = async ()=>{
  await addDoc(collection(db,"requests"),{
    userId: WALLET,
    amount: Number(amt.value),
    type: type.value,
    walletAddress: waddr.value,
    txHash: type.value==="deposit"?txh.value:"",
    status: "pending",
    createdAt: serverTimestamp()
  });

  await updateDoc(userRef,{pendingRequest:true});
  alert("Request submitted");
};

/* ===== HISTORY ===== */
async function loadHistory(){
  const q = query(
    collection(db,"transactions"),
    where("userId","==",WALLET),
    orderBy("createdAt","desc")
  );
  const snap = await getDocs(q);
  let html="";
  snap.forEach(d=>{
    const t=d.data();
    html+=`
      <div class="tx">
        <b>${t.type}</b> ${t.amount} USDC<br>
        <span class="small">${t.createdAt.toDate().toLocaleString()}</span>
      </div>`;
  });
  document.getElementById("history").innerHTML = html || "No history";
}

/* ===== VALIDATOR ===== */
function validatorPanel(){
  return `
    <hr>
    <h3>Validator Panel</h3>
    <input id="vu" placeholder="User Wallet TG_xxx">
    <button onclick="viewUser()">View User</button>
    <div id="vout"></div>
  `;
}

window.viewUser = async ()=>{
  const u = vu.value.trim();
  const snap = await getDoc(doc(db,"users",u));
  if(!snap.exists()) return alert("User not found");

  vout.innerHTML = `
    <hr>
    Balance: ${snap.data().balance} USDC
  `;
};

function appDiv(h){document.getElementById("app").innerHTML=h;}
init();
</script>
</body>
</html>
