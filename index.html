<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; font-size:16px; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp,
  query, where, orderBy, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ===== FIREBASE ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1",
  storageBucket: "stabix-backend-v1.firebasestorage.app",
  messagingSenderId: "351361221507",
  appId: "1:351361221507:web:ebaf0d15e86d4b184c6cb6"
};

const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);

/* ===== TELEGRAM ===== */
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const tgUser = tg.initDataUnsafe?.user;
if(!tgUser?.id){ document.getElementById("app").innerHTML="Telegram user not found"; throw ""; }

/* ===== IDENTITY ===== */
const WALLET = "TG_" + tgUser.id;
const userRef = doc(db,"users",WALLET);
const validatorRef = doc(db,"validators",String(tgUser.id));

/* ===== INIT ===== */
async function init(){
  const snap = await getDoc(userRef);
  if(!snap.exists()) return renderSetup();
  if(!snap.data().password) return renderSetPassword();
  renderLogin();
}

/* ===== SETUP ===== */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Account</h3>
      <input id="uname" placeholder="Username">
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="saveProfile()">Save</button>
    </div>
  `);
}

window.saveProfile = async ()=>{
  await setDoc(userRef,{
    username: uname.value,
    password: pwd.value,
    walletAddress: WALLET,
    balance: 0,
    createdAt: serverTimestamp()
  });
  renderApp();
};

/* ===== SET PASSWORD (FIX) ===== */
function renderSetPassword(){
  appDiv(`
    <div class="box">
      <h3>Set Password</h3>
      <input id="pwd" type="password">
      <button onclick="setPassword()">Save</button>
    </div>
  `);
}

window.setPassword = async ()=>{
  await updateDoc(userRef,{ password: pwd.value });
  renderLogin();
};

/* ===== LOGIN ===== */
function renderLogin(){
  appDiv(`
    <div class="box">
      <h3>Login</h3>
      <input id="pwd" type="password">
      <button onclick="login()">Login</button>
    </div>
  `);
}

window.login = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().password !== pwd.value) return alert("Wrong password");
  renderApp();
};

/* ===== MAIN APP ===== */
async function renderApp(){
  const user = (await getDoc(userRef)).data();
  const isValidator = (await getDoc(validatorRef)).exists();

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>
      <b>Balance:</b> ${user.balance.toFixed(2)} USDC

      <hr>
      <input id="sendTo" placeholder="Receiver TG_xxx">
      <input id="sendAmt" type="number" placeholder="Amount">
      <button onclick="sendUSDC()">Send</button>

      <hr>
      <h3>History</h3>
      <div id="history">Loading…</div>

      ${isValidator ? validatorPanel() : ""}
    </div>
  `);

  loadHistory();
}

/* ===== SEND ===== */
window.sendUSDC = async ()=>{
  await runTransaction(db, async(tx)=>{
    const from = await tx.get(userRef);
    const toRef = doc(db,"users",sendTo.value);
    const to = await tx.get(toRef);

    tx.update(userRef,{ balance: from.data().balance - Number(sendAmt.value) });
    tx.update(toRef,{ balance: to.data().balance + Number(sendAmt.value) });

    await addDoc(collection(db,"transactions"),{
      userId: WALLET,
      type:"send",
      amount:Number(sendAmt.value),
      createdAt: serverTimestamp()
    });
  });
  renderApp();
};

/* ===== HISTORY ===== */
async function loadHistory(){
  const q = query(collection(db,"transactions"),
    where("userId","==",WALLET),
    orderBy("createdAt","desc"));
  const snap = await getDocs(q);
  history.innerHTML = snap.docs.map(d=>`<div class="tx">${d.data().type} - ${d.data().amount}</div>`).join("") || "No history";
}

/* ===== VALIDATOR ===== */
function validatorPanel(){
  return `<hr><h3>Validator Panel Active</h3>`;
}

/* ===== UTIL ===== */
function appDiv(h){ document.getElementById("app").innerHTML = h; }

init();
</script>
</body>
</html>
