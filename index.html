<!DOCTYPE html>
<html>
<head>
<title>StabiX</title>
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#0B1020">
<link rel="icon" type="image/png" sizes="32x32" href="./media/icon-192.png">
<link rel="shortcut icon" href="./media/icon-192.png">
<link rel="apple-touch-icon" href="./media/icon-192.png">
</head>
<body>
<div id="app">Loading…</div>
<!-- ===== Transaction Popup ===== -->
<div id="txPopup" class="tx-popup">
<div class="tx-card">
<audio id="txSound" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3" type="audio/mpeg">
</audio>
<div class="spinner">
<svg viewBox="0 0 120 120">
<circle class="circle-bg" cx="60" cy="60" r="52"/>
<circle class="circle-progress" cx="60" cy="60" r="52"/>
<polyline id="tick" points="38,65 55,80 82,45"/>
<line id="crossLine1" x1="40" y1="40" x2="80" y2="80"
style="display:none;stroke:#ef4444;stroke-width:10;stroke-linecap:round"/>
<line id="crossLine2" x1="80" y1="40" x2="40" y2="80"
style="display:none;stroke:#ef4444;stroke-width:10;stroke-linecap:round"/>
</svg>
</div>

<div id="txTitle"
style="
font-size:22px;
font-weight:bold;
color:#22c55e;
margin-bottom:10px;
">
Transaction Successful
</div>

<div id="txMsg" style="font-size:16px;"></div>

<div id="txSTR"
style="
margin-top:8px;
font-size:13px;
font-weight:600;
color:#60a5fa;
">
</div>

<div id="txTime" class="small" style="margin-top:6px;"></div>

<button id="txDoneBtn"
style="margin-top:16px;background:#22c55e;color:#022c22;"
onclick="closeTxPopup(); window.goHome();">
DONE
</button>
</div>
</div>
  
 <!-- ===== Sending UI===== -->
<div id="sendScreen">
<div class="sendHeader">
<button onclick="closeSend()" class="backBtn">
←
</button>
<h2 id="sendTitle" style="display:flex;align-items:center;gap:8px;justify-content:center;">
<span id="sendText">Send</span>
<img id="sendAssetImg"
src="./media/usd-coin-usdc-logo.png"
style="width:20px;height:20px;border-radius:50%;">  
</h2>
</div>
<div class="sendBody">
<h1 class="sendTitle">StabiX UID</h1>
<div class="addressBox">
<input
id="sendTo"
placeholder="Enter StabiX UID (STBXxxx)"
autocomplete="off"
/>
</div>
<button class="nextBtn" onclick="goAmount()">
Next
</button>
</div>
<div class="sendHint">
<div class="hintTitle">Transfer Guidelines</div>
<div class="hintLine">
• Enter the recipient's valid StabiX UID.
</div>
<div class="hintLine">
• Verify the UID before proceeding.
</div>
</div>
</div>
    <!-- ===== Amount Screen===== -->
<div id="amountScreen" style="display:none">
<div class="sendHeader">
<button onclick="backToAddress()" class="backBtn">←</button>
<h2 id="amountTitle" style="display:flex;align-items:center;gap:8px;justify-content:center;">
<span id="amountText">Send</span>
<img id="amountAssetImg"
src="./media/usd-coin-usdc-logo.png"
style="width:20px;height:20px;border-radius:50%;">
</h2>
</div>
<div class="sendBody">
<div class="sendIcon">⬆</div>
<h1 class="sendTitle">Enter Amount</h1>
<input
id="sendAmt"
type="text"
inputmode="decimal"
placeholder="0"
class="amountInput"
oninput="if(this.value.startsWith('.')) this.value='0'+this.value"
/>
<button class="nextBtn" onclick="handleNext()">
Next
</button>
</div>
</div>
         <!-- =====Confirm Screen===== -->
<div id="confirmScreen" style="display:none">
<div class="sendHeader">
<button onclick="backToAmount()" class="backBtn">←</button>
</div>
<div class="sendBody">
<h1 id="confirmAmount" class="confirmAmount">
-0 USDC
</h1>
<hr class="confirmDivider">
<div class="confirmRow">
<span class="confirmLabel">Transaction Fee</span>
<span id="feeText" class="confirmValue">0</span>
</div>
<hr>
<div class="confirmRow">
<span class="confirmLabel">From</span>
<span id="confirmFrom" class="confirmValue mono"></span>
</div>
<hr>
<div class="confirmRow">
<span class="confirmLabel">To</span>
<span id="confirmTo" class="confirmValue mono"></span>
</div>
<button class="confirmBtn" onclick="sendUSDC()">
Confirm
</button>
</div>
</div>
             
 <!-- ===== QR Code===== -->
<script src="https://unpkg.com/html5-qrcode"></script> 

<div id="scannerOverlay" style="
display:none;
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:var(--card);
z-index:99999;
">

<div id="qr-reader" style="
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
z-index:9999;
"></div>

<div id="scanBox" style="
position:fixed;
top:40%;
left:50%;
width:240px;
height:240px;
transform:translate(-50%, -50%);
pointer-events:none;
">
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
</div>

<button onclick="closeScanner()" style="
position:absolute;
top:15px;
left:15px;
background:rgba(0,0,0,0.7);
color:var(--text);
border:none;
font-size:18px;
width:40px;
height:40px;
border-radius:50%;
z-index:100000;
">✕</button>
  
<button id="torchBtn" onclick="toggleTorch()" style="
position:absolute;
top:15px;
right:15px;
background:rgba(0,0,0,0.7);
color:var(--text);
border:none;
font-size:18px;
width:40px;
height:40px;
border-radius:50%;
z-index:100000;
">
<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"
style="transform:translate(-5px, -5px);">
<path d="M6 2h12v3H6V2zm3 5h6c1.1 0 2 .9 2 2v11c0 1.1-.9 2-2 2H9c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2zm3 3a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/>
</svg>
</button>

<label for="galleryInput" id="galleryBtn" style="
position:fixed;
bottom:100px;
left:50%;
transform:translateX(-50%);
background:var(--text);
color:var(--bg);
border:none;
height:48px;
padding:0 20px;
border-radius:999px;
font-size:15px;
font-weight:500;
z-index:100000;
display:inline-flex;
align-items:center;
gap:8px;
line-height:1;
">
<!-- Gallery Icon + Text -->
<span style="
display:inline-flex;
align-items:center;
gap:8px;
white-space:nowrap;
transform:translateY(15px);  
">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="display:block;">
<rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
<circle cx="8" cy="10" r="2" fill="currentColor"/>
<path d="M21 16L16 11L5 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<span>Upload From Gallery</span>
</span>
<input 
type="file" 
id="galleryInput" 
accept="image/*" 
style="display:none"
onchange="handleGallery(event)">
</div>
  
 <!-- Bottom Navigation -->
<div id="bottomNav" style="
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:420px;
height:70px;
background:color-mix(in srgb, var(--bg) 90%, transparent);
backdrop-filter:blur(12px);
border-radius:22px;
display:flex;
justify-content:space-around;
align-items:center;
z-index:999;
box-shadow:var(--shadow);
">

<!-- HOME TAB -->
<div id="tab-home" onclick="navigateHome();selectTab(this)" style="flex:1;text-align:center;cursor:pointer" class="nav-item nav-item-active">
<div class="nav-icon">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none">
<path d="M3 10L12 3L21 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M5 10V20H19V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
</div>
<div class="nav-text">Home</div>
</div>

<!-- D/W TAB -->
<div id="tab-deposit" onclick="goDeposit();selectTab(this)" style="flex:1;text-align:center;cursor:pointer" class="nav-item">
<div class="nav-icon">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none">
<path d="M7 8V14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M4 11L7 14L10 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M17 14V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M14 11L17 8L20 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div>
<div class="nav-text">D/W</div>
</div>

<!-- BUSINESS -->
<div id="tab-business" onclick="openBusiness();selectTab(this)">
<div class="business-fab">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none">
<circle cx="12" cy="7.2" r="3.2" fill="white"/>
<path d="M6.5 18c0-3.2 2.7-5 5.5-5s5.5 1.8 5.5 5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
</svg>
</div>
<div class="nav-text">Business</div>
</div>

<!-- HISTORY -->
<div id="tab-history" onclick="goHistory();selectTab(this)" style="flex:1;text-align:center;cursor:pointer" class="nav-item">
<div class="nav-icon">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none">
<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
<path d="M12 7V12L15 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
</div>
<div class="nav-text">History</div>
</div>

<!-- SETTINGS -->
<div id="tab-settings" onclick="goSettings();selectTab(this)" style="flex:1;text-align:center;cursor:pointer" class="nav-item">
<div class="nav-icon">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none">
<line x1="5" y1="7" x2="19" y2="7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<line x1="5" y1="17" x2="19" y2="17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
</svg>
</div>
<div class="nav-text">Settings</div>
</div>
</div>

  
<script src="./js/identity.js"></script>
<script type="module" src="./js/app.js"></script>
<script src="./js/auth.js"></script>

 <!-- ===== Error Tool===== -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script>
window.onerror = function(msg, url, line, col, error) {
console.log("❌ ERROR:", msg);
console.log("📍 File:", url);
console.log("📌 Line:", line, "Column:", col);
};
</script>


  
</body>
</html>
