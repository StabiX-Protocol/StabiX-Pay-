<!DOCTYPE html>
<html>
<head>
  <title>StabiX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
    .box { background:#020617; border:1px solid #1e293b; border-radius:12px; padding:20px; max-width:420px; margin:auto; }
    input, button, select { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
    hr { border:0; border-top:1px solid #1e293b; margin:15px 0; }
    .small { font-size:12px; opacity:.7; }
    .tx { font-size:13px; border-bottom:1px dashed #1e293b; padding:6px 0; }
    .warn { color:#facc15; font-size:13px; }
  </style>
</head>

<body>
<div id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, addDoc, getDocs, serverTimestamp,
  query, where, orderBy, runTransaction,
  Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBNs4efcfPoHYk13cU8xuCdnTHOXL1yzT4",
  authDomain: "stabix-backend-v1.firebaseapp.com",
  projectId: "stabix-backend-v1",
  storageBucket: "stabix-backend-v1.firebasestorage.app",
  messagingSenderId: "351361221507",
  appId: "1:351361221507:web:ebaf0d15e86d4b184c6cb6"
};
const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);

/* ================= TELEGRAM ================= */
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const tgUser = tg.initDataUnsafe?.user;
if(!tgUser?.id){ document.getElementById("app").innerHTML="Telegram user not found"; throw ""; }

/* ================= IDENTITY ================= */
const WALLET = "TG_" + tgUser.id;
const userRef = doc(db,"users",WALLET);
const validatorRef = doc(db,"validators",String(tgUser.id));

/* ================= INIT ================= */
async function init(){
  const snap = await getDoc(userRef);
  if(!snap.exists() || !snap.data()?.password){
    renderSetup(); return;
  }
  renderLogin();
}

/* ================= SETUP ================= */
function renderSetup(){
  appDiv(`
    <div class="box">
      <h3>Create Account</h3>
      <input id="uname" placeholder="Username">
      <input id="pwd" type="password" placeholder="Password">
      <button onclick="saveProfile()">Create</button>
    </div>
  `);
}

window.saveProfile = async ()=>{
  await setDoc(userRef,{
    username: uname.value.trim(),
    password: pwd.value.trim(),
    walletAddress: WALLET,
    balance: 0,
    pendingRequest:false,
    isFrozen:false,                 // ✅ ADDED
    lastUsernameChange: serverTimestamp(),
    createdAt: serverTimestamp()
  });
  renderApp();
};

/* ================= LOGIN ================= */
function renderLogin(){
  appDiv(`
    <div class="box">
      <h3>Login</h3>
      <input id="pwd" type="password">
      <button onclick="login()">Login</button>
    </div>
  `);
}

window.login = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().password !== pwd.value.trim()) return alert("Wrong password");
  renderApp();
};

/* ================= MAIN APP ================= */
async function renderApp(){
  const user = (await getDoc(userRef)).data();
  const isValidator = (await getDoc(validatorRef)).exists();
  const today = new Date().toISOString().split("T")[0];

  appDiv(`
    <div class="box">
      <h2>${user.username}</h2>
      <p class="small">${WALLET}</p>

      <b>Balance:</b> ${user.balance.toFixed(2)} USDC
      ${user.isFrozen ? `<div class="warn">Pending request under review</div>` : ""}

      <hr>
      <h3>Send USDC</h3>
      <input id="sendTo" placeholder="Receiver Wallet (TG_xxx)">
      <input id="sendAmt" type="number" placeholder="Amount">
      <button onclick="sendUSDC()">Send</button>

      <hr>
      <h3>Deposit / Withdraw</h3>

      <select id="dwType" onchange="toggleDW()">
        <option value="deposit">Deposit</option>
        <option value="withdraw">Withdraw</option>
      </select>

      <input id="dwAmount" type="number" placeholder="Amount">
      <input id="dwWallet" placeholder="Wallet Address">

      <div id="txHashBox">
        <input id="dwTxHash" placeholder="Transaction Hash (Deposit only)">
      </div>

      <button onclick="submitDW()">Submit</button>

      <hr>
      <h3>Transaction History</h3>
      <input id="historyDate" type="date" value="${today}" max="${today}" onchange="loadHistoryByDate()">
      <div id="history">Loading...</div>

      ${isValidator ? validatorPanel() : ""}
    </div>
  `);

  loadHistory();
  if(isValidator) loadRequests();
}

/* ================= SEND USDC ================= */
window.sendUSDC = async ()=>{
  try{
    await runTransaction(db, async(tx)=>{
      const fromSnap = await tx.get(userRef);

      if(fromSnap.data().isFrozen)       // ✅ ADDED
        throw "Account frozen";

      const amount = Number(sendAmt.value);
      if(amount<=0 || fromSnap.data().balance < amount)
        throw "Invalid amount";

      const toRef = doc(db,"users",sendTo.value);
      const toSnap = await tx.get(toRef);
      if(!toSnap.exists()) throw "Receiver not found";

      tx.update(userRef,{ balance: fromSnap.data().balance - amount });
      tx.update(toRef,{ balance: toSnap.data().balance + amount });

      tx.set(doc(collection(db,"transactions")),{
        userId: WALLET, type:"sent", amount,
        counterparty:sendTo.value, createdAt:serverTimestamp()
      });

      tx.set(doc(collection(db,"transactions")),{
        userId: sendTo.value, type:"received", amount,
        counterparty:WALLET, createdAt:serverTimestamp()
      });
    });
    renderApp();
  }catch(e){ alert(e); }
};

/* ================= DEPOSIT / WITHDRAW ================= */
window.toggleDW = ()=>{
  txHashBox.style.display = dwType.value==="deposit" ? "block" : "none";
};

window.submitDW = async ()=>{
  const snap = await getDoc(userRef);
  if(snap.data().pendingRequest) return alert("Already pending");

  await addDoc(collection(db,"requests"),{
    userId: WALLET,
    type: dwType.value,
    amount: Number(dwAmount.value),
    walletAddress: dwWallet.value,
    txHash: dwType.value==="deposit" ? dwTxHash.value : "",
    status:"pending",
    createdAt: serverTimestamp()
  });

  await updateDoc(userRef,{
    pendingRequest:true,
    isFrozen:true          // ✅ ADDED
  });

  renderApp();
};

/* ================= HISTORY ================= */
async function loadHistory(){
  const q = query(collection(db,"transactions"), where("userId","==",WALLET));
  const snap = await getDocs(q);
  renderHistoryFromSnap(snap,"No transactions");
}

window.loadHistoryByDate = async ()=>{
  const d = historyDate.value;
  const s = Timestamp.fromDate(new Date(d+"T00:00:00"));
  const e = Timestamp.fromDate(new Date(d+"T23:59:59"));

  const q = query(
    collection(db,"transactions"),
    where("userId","==",WALLET),
    where("createdAt",">=",s),
    where("createdAt","<=",e)
  );
  const snap = await getDocs(q);
  renderHistoryFromSnap(snap,"No transactions");
};

function renderHistoryFromSnap(snap,empty){
  let h="";
  snap.forEach(d=>{
    const t=d.data();
    const sign=t.type==="received"||t.type==="deposit"?"+":"-";
    const col=sign==="+"?"#22c55e":"#ef4444";
    h+=`<div class="tx" style="color:${col}">
      <b>${sign}${t.amount} USDC</b><br>
      <span class="small">${t.type} • ${t.createdAt?.toDate()?.toLocaleString()}</span>
    </div>`;
  });
  history.innerHTML=h||`<span class="small">${empty}</span>`;
}

/* ================= VALIDATOR ================= */
function validatorPanel(){
  return `
    <hr>
    <h3>Validator Panel</h3>
    <button onclick="loadRequests()">Load Pending</button>
    <div id="vout"></div>
  `;
}

window.loadRequests = async ()=>{
  const q=query(collection(db,"requests"),where("status","==","pending"));
  const snap=await getDocs(q);
  let h="";
  snap.forEach(d=>{
    const r=d.data();
    h+=`
      <div class="tx">
        ${r.userId} | ${r.type} | ${r.amount}
        <button onclick="approve('${d.id}')">✔</button>
        <button onclick="reject('${d.id}')">✖</button>
      </div>`;
  });
  vout.innerHTML=h||"No pending";
};

window.approve = async(id)=>{
  await runTransaction(db,async(tx)=>{
    const r=(await tx.get(doc(db,"requests",id))).data();
    const uRef=doc(db,"users",r.userId);
    const u=(await tx.get(uRef)).data();
    const nb=r.type==="deposit"?u.balance+r.amount:u.balance-r.amount;
    if(nb<0) throw "Invalid";
    tx.update(uRef,{balance:nb,pendingRequest:false,isFrozen:false});
    tx.update(doc(db,"requests",id),{status:"approved"});
  });
  loadRequests();
};

window.reject = async(id)=>{
  const r=(await getDoc(doc(db,"requests",id))).data();
  await updateDoc(doc(db,"users",r.userId),{pendingRequest:false,isFrozen:false});
  await updateDoc(doc(db,"requests",id),{status:"rejected"});
  loadRequests();
};

/* ================= UTIL ================= */
function appDiv(h){ document.getElementById("app").innerHTML=h; }
  
init();
</script>
</body>
</html>
